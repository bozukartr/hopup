<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E7EBF0">
<meta name="description" content="SAPAN — sapanla potaya at. Süreye karşı basket avı.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SAPAN">
<title>Hopup · Sapan Basket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7EBF0; --ink:#1B2230;
    --paper-rgb:231,235,240; --ink-rgb:27,34,48;
    --mint:#2ED8A8; --amber:#F2B705; --ice:#69BFFF; --coral:#FF4D5E; --violet:#A97BE0;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--ink);
    font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none}
  canvas{display:block;position:fixed;inset:0}

  .sheet{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;
    padding:calc(var(--safe-t) + 24px) 28px calc(var(--safe-b) + 24px);
    background:rgba(var(--paper-rgb),.93);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    color:var(--ink);text-align:center;z-index:10;animation:fade .22s ease both;
  }
  .sheet.hide{display:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .mark{line-height:.86}
  .mark b{display:block;font-weight:700;font-size:clamp(52px,17vw,96px);letter-spacing:-.05em}
  .mark span{display:block;margin-top:10px;font-size:15px;font-weight:400;opacity:.62}

  .keys{display:grid;gap:10px;width:100%;max-width:310px}
  .key{display:flex;align-items:center;gap:11px;font-size:14.5px;text-align:left}
  .key i{font-style:normal;opacity:.5;font-size:13px;margin-left:auto;text-align:right}
  .dot{width:22px;height:22px;border-radius:50%;flex:none;background:var(--ink)}
  .dot.t{background:var(--ice);box-shadow:0 0 0 3px rgba(105,191,255,.26)}
  .dot.w{background:var(--amber);box-shadow:0 0 0 3px rgba(242,183,5,.26)}
  .dot.d{background:var(--violet);box-shadow:0 0 0 3px rgba(169,123,224,.26)}
  .bar{width:22px;height:7px;border-radius:4px;flex:none;background:var(--coral)}
  .hoopy{width:22px;height:14px;flex:none;border:2.5px solid var(--coral);
    border-top:0;border-radius:0 0 4px 4px}

  button{font-family:inherit;font-size:17px;font-weight:600;color:var(--paper);
    background:var(--ink);border:0;border-radius:100px;padding:16px 46px;cursor:pointer;
    transition:transform .12s ease}
  button:active{transform:scale(.95)}
  button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
  button.ghost{background:transparent;color:var(--ink);
    box-shadow:inset 0 0 0 2px rgba(var(--ink-rgb),.22);padding:13px 34px;font-size:15px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}

  .tally{display:flex;gap:30px;align-items:flex-end}
  .tally div small{display:block;font-size:12.5px;opacity:.55;margin-bottom:2px}
  .tally div strong{font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tally div.alt strong{font-size:26px;opacity:.5}
  .over-title{font-size:21px;font-weight:600}
  .over-sub{font-size:14px;opacity:.55;margin-top:-16px}
  .badge{font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
    background:var(--mint);color:var(--ink);padding:7px 14px;border-radius:100px;
    animation:pulse 1.1s ease-in-out infinite}
  .badge.hide{display:none}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:calc(var(--safe-t) + 10px);
    left:calc(var(--safe-l) + var(--play-l,10px));
    right:calc(var(--safe-r) + var(--play-r,10px));
    z-index:5;display:flex;align-items:flex-start;justify-content:space-between;
    pointer-events:none;color:var(--ink)}
  #hud.hide{display:none}
  .hbtn{pointer-events:auto;width:42px;height:42px;border-radius:100px;padding:0;
    background:rgba(var(--ink-rgb),.10);color:var(--ink);font-size:16px;font-weight:600;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .hbtn svg{width:17px;height:17px;fill:currentColor}
  #scoreWrap{text-align:center;line-height:1}
  #score{font-size:36px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
    display:block;transition:transform .1s ease}
  #score.bump{transform:scale(1.2)}
  #scoreWrap small{display:block;font-size:11px;font-weight:400;opacity:.42;margin-top:3px}
  #tsec{display:block;font-size:15px;font-weight:700;margin-top:6px;
    font-variant-numeric:tabular-nums;opacity:.55;letter-spacing:.02em}
  #tsec.low{color:var(--coral);opacity:1;animation:tpulse .7s ease-in-out infinite}
  #combo{display:block;font-size:13px;font-weight:700;color:#0E9E76;margin-top:6px;
    opacity:0;transition:opacity .15s ease;letter-spacing:.04em}
  #combo.on{opacity:1}
  #power{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .pw{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;
    letter-spacing:.07em;padding:3px 8px 3px 4px;border-radius:100px;color:var(--ink);
    white-space:nowrap;background:rgba(var(--paper-rgb),.88);
    box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.13);
    animation:pwin .26s cubic-bezier(.2,1.5,.4,1) both}
  .pw b{width:10px;height:10px;border-radius:50%;display:block;flex:none}
  @keyframes pwin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}

  /* ---------- süre çubuğu ---------- */
  #timebar{position:fixed;top:calc(var(--safe-t) + 2px);
    left:calc(var(--safe-l) + var(--play-l,10px));
    right:calc(var(--safe-r) + var(--play-r,10px));
    height:5px;border-radius:100px;background:rgba(var(--ink-rgb),.12);
    z-index:5;pointer-events:none;overflow:hidden}
  #timebar.hide{display:none}
  #timefill{height:100%;width:100%;border-radius:100px;background:var(--ink);
    transform-origin:left center;transition:background .3s ease}
  #timebar.low #timefill{background:var(--coral)}
  #timebar.low{animation:tpulse .7s ease-in-out infinite}
  @keyframes tpulse{0%,100%{opacity:1}50%{opacity:.5}}

  /* ---------- bildirim ---------- */
  #toast{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 150px);z-index:6;
    display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
  .tst{background:rgba(var(--ink-rgb),.9);color:var(--paper);font-size:13.5px;font-weight:500;
    padding:8px 18px;border-radius:100px;animation:tin .3s ease both;white-space:nowrap;
    max-width:88vw;overflow:hidden;text-overflow:ellipsis}
  .tst.big{font-size:15px;font-weight:600;letter-spacing:.06em}
  .tst.out{animation:tout .3s ease both}
  @keyframes tin{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-9px)}}

  #count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:11;font-size:88px;font-weight:700;color:var(--ink);pointer-events:none;
    letter-spacing:-.04em}
  #count.hide{display:none}
  #count span{animation:cpop .7s ease both}
  @keyframes cpop{0%{transform:scale(.55);opacity:0}25%{transform:scale(1);opacity:1}
    75%{opacity:1}100%{transform:scale(1.25);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    button,.sheet,.tst,#count span,.badge,#timebar.low{transition:none;animation:none}
  }

  /* Arcade shell: compact, thumb-friendly and independent of court palette. */
  .sheet{overflow-y:auto;gap:20px}
  #menu{background:radial-gradient(ellipse at 80% 25%,#284651 0,transparent 55%),#101f2b;color:#f7f4ec;gap:16px;justify-content:safe center}
  .menu-top{width:100%;max-width:360px;display:flex;justify-content:space-between;align-items:center}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:.22em;color:#9fb5be}
  .menu-top .hbtn{background:#ffffff12;color:#faf5e9;width:44px;height:44px}
  #menu .mark b{font-size:clamp(52px,15vw,76px);letter-spacing:-.065em;color:#faf5e9}
  #menu .mark b em{color:#ff9860;font-style:normal}
  #menu .mark span{font-size:13px;opacity:.7;letter-spacing:.04em}
  .hero{width:min(100%,330px);height:clamp(145px,25vh,230px);overflow:visible}
  .hero-ball{transform-origin:142px 139px;animation:hero-hop 2.8s ease-in-out infinite}
  @keyframes hero-hop{0%,100%{transform:translate(-26px,18px) rotate(-18deg)}50%{transform:translate(28px,-34px) rotate(45deg)}}
  .menu-actions{width:100%;max-width:340px;display:grid;gap:10px}
  #btnStart{background:#ff9559;color:#162330;border-radius:19px;padding:18px;box-shadow:0 6px 0 #b75d32;font-size:19px}
  #btnPractice{background:#ffffff0d;color:#eaf1f1;border:1px solid #ffffff20;border-radius:16px;padding:13px;font-size:14px}
  .menu-hint{color:#b1c3cb;font-size:12px;line-height:1.65;max-width:300px}
  #menuStats{width:100%;max-width:340px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat-card{background:#ffffff08;border:1px solid #ffffff12;border-radius:15px;padding:12px 5px}
  .stat-card strong{display:block;font-size:22px;color:#f9f3e6;font-variant-numeric:tabular-nums}
  .stat-card small{font-size:10px;color:#9fb5be}
  #journey{position:fixed;bottom:calc(var(--safe-b) + 12px);left:50%;transform:translateX(-50%);width:min(82vw,330px);z-index:5;pointer-events:none;color:#f3eee3;text-align:center}
  #journey.hide{display:none}
  #courtLabel{font-size:10px;letter-spacing:.16em;color:#aec5ca}
  #goalLabel{font-size:12px;margin-top:4px}
  .progress-track{height:3px;background:#ffffff20;margin:8px auto 0;border-radius:8px;overflow:hidden}
  #goalFill{height:100%;background:#66ddbd;transform-origin:left;transition:transform .25s}
  #hud{align-items:flex-start}
  #scoreWrap{padding:9px 22px 10px;border-radius:0 0 23px 23px;background:rgba(var(--paper-rgb),.88);box-shadow:0 8px 24px #15223008;min-width:115px}
  #score{font-size:42px}
  .hbtn{width:44px;height:44px}
  .tally{gap:16px;flex-wrap:wrap;justify-content:center}
  .tally div strong{font-size:40px}
  #runDetails{font-size:13px;line-height:1.8;opacity:.7;max-width:320px}
  @media(max-height:640px){#menu{gap:10px;padding-top:12px;padding-bottom:12px}.hero{height:110px}.mark span{margin-top:6px}.stat-card{padding:7px 4px}#menu .mark b{font-size:48px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hide">
  <button class="hbtn" id="btnPause" aria-label="Duraklat">
    <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4.4" height="16" rx="1.4"/><rect x="13.6" y="4" width="4.4" height="16" rx="1.4"/></svg>
  </button>
  <div id="scoreWrap">
    <span id="score">0</span>
    <small>sayı</small>
    <span id="tsec">45"</span>
    <span id="combo"></span>
    <span id="power"></span>
  </div>
  <button class="hbtn" id="btnSound" aria-label="Sesi aç veya kapat"><span id="sndIcon">♪</span></button>
</div>
<div id="timebar" class="hide"><div id="timefill"></div></div>

<div id="journey" class="hide"><div id="courtLabel"></div><div id="goalLabel"></div><div class="progress-track"><div id="goalFill"></div></div></div>
<div id="toast" aria-live="polite"></div>
<div id="count" class="hide"></div>

<div class="sheet" id="menu">
  <div class="menu-top"><span class="eyebrow">TEK PARMAK · TAM İSABET</span><button class="hbtn" id="btnMenuSound" aria-label="Sesi kapat">♪</button></div>
  <div class="mark"><b>hop<em>up.</em></b><span>Sapanı çek. Ritmini bul.</span></div>
  <svg class="hero" viewBox="0 0 340 220" aria-hidden="true">
    <defs><linearGradient id="courtPaint" x2="0" y2="1"><stop stop-color="#345460"/><stop offset="1" stop-color="#182e3c"/></linearGradient><radialGradient id="ballPaint" cx="30%" cy="25%"><stop stop-color="#ffc17a"/><stop offset=".65" stop-color="#f58a43"/><stop offset="1" stop-color="#c64b25"/></radialGradient></defs>
    <ellipse cx="170" cy="197" rx="155" ry="19" fill="#091723" opacity=".5"/>
    <path d="M25 172 173 111 322 176 174 218Z" fill="url(#courtPaint)" stroke="#45616a"/>
    <path d="m64 175 109-45 110 47-110 30Z M113 181q60-43 119 0" fill="none" stroke="#718e93" opacity=".45"/>
    <path d="M283 167V42" stroke="#66828b" stroke-width="7"/>
    <rect x="235" y="22" width="77" height="65" rx="9" fill="#cce6e8" fill-opacity=".16" stroke="#ccdedb" stroke-width="3"/>
    <path d="M254 70V45h34v25" stroke="#eef5ed" fill="none" stroke-width="3"/>
    <path d="m243 83 9 35h30l10-35m-42 10h36m-32 13h29m-24-23 6 35m13-35-6 35" fill="none" stroke="#d5e4dd" stroke-width="1.6"/>
    <ellipse cx="267" cy="82" rx="27" ry="6" fill="none" stroke="#ff9962" stroke-width="5"/>
    <path d="M82 155Q122 6 240 67" fill="none" stroke="#7edac2" stroke-width="2" stroke-dasharray="3 10" opacity=".6"/>
    <g class="hero-ball"><circle cx="142" cy="139" r="30" fill="url(#ballPaint)" stroke="#ffb77b"/><g stroke="#76371f" stroke-width="2" fill="none"><path d="M112 139h60m-30-30v60m-22-51q38 21 0 43m44-43q-38 21 0 43"/></g><path d="M125 122q8-9 17-7" stroke="#ffe0a3" stroke-width="3" stroke-linecap="round" fill="none"/></g>
    <path d="m76 75 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#7edac2"/>
  </svg>
  <div id="menuStats"></div>
  <div class="menu-actions"><button id="btnStart">Sahaya çık ↗</button><button id="btnPractice">Antrenman · Süresiz oyna</button></div>
  <p class="menu-hint">Ekranın herhangi bir yerinden geri çek ve bırak.<br>Temiz basket +3 sayı. Her basket ek süre.</p>
</div>

<div class="sheet hide" id="pause">
  <div class="mark"><b style="font-size:clamp(34px,10vw,54px)">DURDU</b></div>
  <div class="row"><button id="btnResume">Devam et</button></div>
  <div class="row"><button class="ghost" id="btnQuit">Menüye dön</button></div>
</div>

<div class="sheet hide" id="over">
  <div class="badge hide" id="recBadge">Yeni rekor</div>
  <div class="over-title" id="overTitle">Süre doldu</div>
  <div class="over-sub" id="overSub"></div>
  <div class="tally">
    <div><small>Sayı</small><strong id="sc">0</strong></div>
    <div class="alt"><small>Rekor</small><strong id="bs">0</strong></div>
    <div class="alt"><small>Basket</small><strong id="bk">0</strong></div>
    <div class="alt"><small>En iyi seri</small><strong id="bc">0</strong></div>
  </div>
  <div id="runDetails"></div>
  <div class="row"><button id="btnAgain">Yeniden dene</button></div>
  <div class="row"><button class="ghost" id="btnMenu">Menü</button></div>
</div>

<script>
(() => {
'use strict';

/* ================= sabitler ================= */
const VW = 420, VH = 900;          // sanal saha — her cihazda aynı
const WALLW = 14;
const PL = WALLW, PR = VW - WALLW;
const FLOOR = 812;                  // zemin yüzeyi
const G = .62, MAXV = 34, BR = 15;
const PULL_MIN = 6, PULL_MAX = 24;  // atış gücü: 6 .. 30
const BOARDW = 10;                  // panya kalınlığı
const RIMW = 64;                    // çember uzunluğu (temel)
const TIP_R = 5;                    // çember ucu yarıçapı
const START_TIME = 45, T_BASKET = 2.5, T_SWISH = 4;
const STEP = 1000/60;

const INK='#1B2230', PAPER='#E7EBF0', MINT='#2ED8A8', AMBER='#F2B705',
      ICE='#69BFFF', CORAL='#FF4D5E', VIOLET='#A97BE0', GREY='#96A0B0';

const PW = {
  time:  {c:ICE,    n:'SÜRE',  s:'+4 sn', h:'saate 4 saniye ekler'},
  wide:  {c:AMBER,  n:'GENİŞ POTA', s:'GENİŞ', h:'3 atış boyunca çember büyür'},
  double:{c:VIOLET, n:'ÇİFT ATIŞ',  s:'ÇİFT',  h:'havada bir kez daha fırlat'},
};

/* sahalar — her 5-8 basketten sonra biri açılır */
const COURTS = [
  {n:'SAHA',       from:0,  paper:'#E7EBF0', ink:'#1B2230', motif:'ring',  wind:0,    move:0,  bars:0, rim:1.00},
  {n:'RÜZGÂR',     from:5,  paper:'#E3ECE7', ink:'#1C3028', motif:'arc',   wind:.055, move:0,  bars:0, rim:.97},
  {n:'KAYAN POTA', from:11, paper:'#DCEAF3', ink:'#16303F', motif:'shard', wind:0,    move:40, bars:0, rim:.93},
  {n:'ENGEL',      from:18, paper:'#F0E8DB', ink:'#33261A', motif:'drip',  wind:.035, move:30, bars:1, rim:.90},
  {n:'YÜKSEK',     from:26, paper:'#EDE3EC', ink:'#2C1E30', motif:'crack', wind:.06,  move:48, bars:1, rim:.84},
  {n:'FIRTINA',    from:35, paper:'#D8DBE6', ink:'#14161F', motif:'bolt',  wind:.09,  move:60, bars:1, rim:.78},
];

/* ================= yardımcılar ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function mixRGB(a,b,t){
  const A=hex(a), B=hex(b);
  return [Math.round(lerp(A[0],B[0],t)), Math.round(lerp(A[1],B[1],t)), Math.round(lerp(A[2],B[2],t))];
}
let seed = 1;
function srand(s){ seed=(s>>>0)||1; }
function rand(){ seed^=seed<<13; seed>>>=0; seed^=seed>>17; seed^=seed<<5; seed>>>=0; return seed/4294967296; }
const rnd=(a,b)=>a+rand()*(b-a);
const fxrnd=(a,b)=>a+Math.random()*(b-a);

/* ================= kayıt ================= */
const KEY='sapan.hoop.v1';
const save={best:0,bestStreak:0,bestBaskets:0,runs:0,sound:true,haptics:true,seen:{},taught:false};
try{ const raw=localStorage.getItem(KEY); if(raw) Object.assign(save, JSON.parse(raw)); }catch(e){}
let saveTimer=0;
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(save)); }catch(e){} }, 120);
}

/* ================= ses ================= */
const Snd = (()=>{
  let ac=null, bus=null, noiseBuf=null;
  function ctxOf(){
    if(ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{
      ac = new AC();
      bus = ac.createGain(); bus.gain.value=.42; bus.connect(ac.destination);
      const n = ac.sampleRate*.4; noiseBuf = ac.createBuffer(1,n,ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
    }catch(e){ ac=null; }
    return ac;
  }
  function on(){ return save.sound && ctxOf(); }
  function resume(){ const a=ctxOf(); if(a && a.state==='suspended') a.resume().catch(()=>{}); }
  function tone(f, dur, o){
    const a=on(); if(!a) return;
    o=o||{};
    const t=a.currentTime + (o.delay||0);
    const osc=a.createOscillator(), g=a.createGain();
    osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(f,t);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to), t+dur);
    const v=(o.vol==null?.22:o.vol);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(v, t+Math.min(.02,dur*.3));
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    osc.connect(g); g.connect(bus); osc.start(t); osc.stop(t+dur+.02);
  }
  function hiss(dur, vol, freq, q, delay){
    const a=on(); if(!a) return;
    const t=a.currentTime+(delay||0);
    const src=a.createBufferSource(); src.buffer=noiseBuf;
    const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q||1;
    const g=a.createGain();
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(bus); src.start(t); src.stop(t+dur);
  }
  return {
    resume,
    stretch(t){ tone(180+t*260,.045,{type:'square',vol:.045,to:200+t*300}); },
    launch(t){ tone(300+t*120,.16,{type:'triangle',vol:.16,to:90}); hiss(.09,.06,900,1.2); },
    dribble(){ tone(120,.11,{type:'sine',vol:.15,to:64}); hiss(.05,.05,420,1.6); },
    wall(){ tone(210,.05,{type:'square',vol:.05,to:150}); },
    rim(){ tone(1180,.16,{type:'square',vol:.09,to:880}); tone(2350,.1,{type:'sine',vol:.05}); },
    board(){ tone(240,.13,{type:'triangle',vol:.13,to:150}); hiss(.07,.06,700,1.1); },
    swish(){ hiss(.26,.13,3100,1.5); hiss(.2,.08,1700,1.2,.04); },
    basket(n){ [523,659,784].forEach((f,i)=>tone(f*Math.pow(1.06,Math.min(n,8)),.22,
      {type:'triangle',vol:.14,delay:i*.055})); },
    perfect(){ [659,880,1175,1568].forEach((f,i)=>tone(f,.26,{type:'triangle',vol:.15,delay:i*.07})); },
    miss(){ tone(190,.22,{type:'sawtooth',vol:.1,to:90}); },
    grab(){ [660,880,1320].forEach((f,i)=>tone(f,.2,{type:'triangle',vol:.13,delay:i*.05})); },
    airshot(){ tone(520,.16,{type:'triangle',vol:.14,to:980}); },
    zone(){ [392,523,659].forEach((f,i)=>tone(f,.5,{type:'sine',vol:.11,delay:i*.09})); },
    record(){ [523,659,784,1047].forEach((f,i)=>tone(f,.28,{type:'triangle',vol:.14,delay:i*.085})); },
    tick(){ tone(760,.06,{type:'square',vol:.07}); },
    urgent(){ tone(980,.09,{type:'square',vol:.1,to:760}); },
    buzzer(){ tone(150,.9,{type:'sawtooth',vol:.22,to:110}); hiss(.8,.1,300,.6); },
  };
})();
function buzz(ms){ if(save.haptics && navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} } }

/* ================= görüntü ================= */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', {alpha:false});
let W=0, H=0, DPR=1, S=1, offX=0, offY=0, visH=VH;

resize();
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize,120));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= durum ================= */
let state='menu', phase='aim';
let ball=null, bars=[], orbs=[], parts=[], rings=[], floats=[], nets=[];
let hoop=null, tick=0, shake=0, slow=0, quality=1, fpsAvg=60;
let score=0, baskets=0, streak=0, bestStreakRun=0, timeLeft=START_TIME;
let ci=0, ciPrev=0, cMix=1, paper=PAPER, ink=INK, paperC=hex(PAPER);
let aim=null, aimId=null, buffered=false;
let scored=false, hitRim=false, hitBoard=false, endT=0, flightT=0;
let wideShots=0, airShots=0;
let newRecord=false, overTimer=0, countTimer=0, urgentAt=99;
let mode='arcade', shots=0, swishes=0, probing=false, trail=[];
let flashC=null, flashA=0, sweep=0, vig=0;

const el = id=>document.getElementById(id);
const elScore=el('score'), elCombo=el('combo'), elHud=el('hud'), elToast=el('toast'),
      elCount=el('count'), elMenu=el('menu'), elPause=el('pause'), elOver=el('over'),
      elBar=el('timebar'), elFill=el('timefill'), elSec=el('tsec');

const court = ()=>COURTS[ci];
function courtAt(n){ let i=0; for(let k=0;k<COURTS.length;k++) if(n>=COURTS[k].from) i=k; return i; }
function applyCourt(){
  const Z=COURTS[ci], P=COURTS[ciPrev], t=Math.min(cMix,1);
  paperC = mixRGB(P.paper, Z.paper, t);
  const inkC = mixRGB(P.ink, Z.ink, t);
  paper = 'rgb('+paperC.join(',')+')';
  ink   = 'rgb('+inkC.join(',')+')';
  const st=document.documentElement.style;
  st.setProperty('--paper', paper); st.setProperty('--paper-rgb', paperC.join(','));
  st.setProperty('--ink', ink);     st.setProperty('--ink-rgb', inkC.join(','));
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=paper;
}
function windNow(){ const w=court().wind; return w ? w*Math.sin(tick*.0042) : 0; }
const rimLen = ()=> RIMW * court().rim * (wideShots>0 ? 1.5 : 1);

/* ================= efektler ================= */
function toast(text, big, ms){
  const d=document.createElement('div');
  d.className='tst'+(big?' big':''); d.textContent=text;
  elToast.appendChild(d);
  setTimeout(()=>{ d.classList.add('out'); setTimeout(()=>d.remove(),320); }, ms||1600);
  while(elToast.children.length>3) elToast.firstChild.remove();
}
function dust(x,y,n,c,spread){
  n=reduceMotion?0:Math.round(n*quality); if(n<=0) return;
  for(let i=0;i<n;i++) parts.push({x,y,vx:fxrnd(-spread,spread),vy:fxrnd(-2.4,-.2),
    life:1,dec:fxrnd(.02,.045),s:fxrnd(2,4.6),c});
  if(parts.length>340) parts.splice(0, parts.length-340);
}
function burst(x,y,c,n){
  n=reduceMotion?0:Math.round(n*quality); if(n<=0) return;
  for(let i=0;i<n;i++){
    const a=(i/n)*6.283+Math.random()*.5, sp=fxrnd(1.8,6.4);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.6,
      life:1,dec:fxrnd(.016,.034),s:fxrnd(2,5),c,g:.12});
  }
  if(parts.length>360) parts.splice(0, parts.length-360);
}
function ring(x,y,c){ if(!reduceMotion && quality>.35) rings.push({x,y,r:8,life:1,c}); }
function floater(x,y,text,c,big){ floats.push({x,y,text,c,life:1,big:!!big}); if(floats.length>8) floats.shift(); }
function addShake(v){ if(!reduceMotion) shake=Math.min(16, shake+v); }
function flash(c,a){ if(reduceMotion) return; flashC=c; flashA=Math.max(flashA,a); }
function netWave(p){ nets.push({t:1, p:p||1}); if(nets.length>4) nets.shift(); }

/* ================= güçlendirmeler ================= */
function syncPower(){
  const on=[];
  if(wideShots>0) on.push(['wide', wideShots]);
  if(airShots>0)  on.push(['double', airShots]);
  const want = on.map(([k,n])=>k+n).join(',');
  if(el('power').dataset.k === want) return;
  el('power').dataset.k = want;
  el('power').innerHTML = on.map(([k,n])=>
    '<span class="pw"><b style="background:'+PW[k].c+'"></b>'+PW[k].s+(n>1?' ×'+n:'')+'</span>'
  ).join('');
}
function grab(o){
  o.taken = true;
  const c = PW[o.type].c;
  if(o.type==='time'){ timeLeft = Math.min(99, timeLeft + 4); floater(o.x,o.y-18,'+4 sn',c,true); }
  else if(o.type==='wide'){ wideShots = Math.min(5, wideShots + 3); floater(o.x,o.y-18,PW[o.type].n,c); }
  else { airShots = Math.min(3, airShots + 1); floater(o.x,o.y-18,PW[o.type].n,c); }
  burst(o.x,o.y,c,18); ring(o.x,o.y,c); flash(c,.2);
  addShake(2.4); Snd.grab(); buzz(12); syncPower();
  if(!save.seen['pw_'+o.type]){
    save.seen['pw_'+o.type]=true; persist();
    toast(PW[o.type].n + ' — ' + PW[o.type].h, false, 2400);
  }

/* ================= saha kurulumu ================= */
function boardX(){ return hoop.side > 0 ? PR - BOARDW : PL; }
function innerX(){ return hoop.side > 0 ? PR - BOARDW : PL + BOARDW; }
function tipX(){ return innerX() - hoop.side * rimLen(); }
function hoopY(){ return hoop.baseY + (hoop.amp ? Math.sin(tick*hoop.spd + hoop.ph)*hoop.amp : 0); }

/* Bu kurulumdan basket atmanın bir yolu var mı?
   Oyunun kendi çarpışma fonksiyonlarını kullanır; topu geçici olarak ödünç alır. */
let probeUntil = 0, relaxed = 0;
let PROBE_MS = 8;   // tur kurulumuna ayrılan kare içi bütçe
function probeShot(vx0, vy0){
  if(performance.now() > probeUntil) return false;   // kare bütçesini aşma
  const sx=ball.x, sy=ball.y, svx=ball.vx, svy=ball.vy;
  const bsave = bars.map(b=>b.x);
  let made=false, t=tick;
  probing=true;
  ball.vx=vx0; ball.vy=vy0; ball.y-=2;
  for(let f=0; f<240 && !made; f++){
    t++;
    ball.vy += G;
    ball.vx += (court().wind ? court().wind*Math.sin(t*.0042) : 0);
    ball.vx = clamp(ball.vx,-MAXV,MAXV); ball.vy = clamp(ball.vy,-MAXV,MAXV);
    for(const b of bars) b.x = b.bx + Math.sin(t*b.spd + b.ph)*b.amp;
    const hy = hoop.baseY + (hoop.amp ? Math.sin(t*hoop.spd + hoop.ph)*hoop.amp : 0);
    const bx0 = boardX(), inX = innerX(), tX = inX - hoop.side*rimLen();
    const lo = Math.min(tX,inX), hi = Math.max(tX,inX);
    const sp = Math.hypot(ball.vx, ball.vy), n = Math.max(1, Math.ceil(sp/4));
    let done=false;
    for(let i=0;i<n;i++){
      const py = ball.y;
      ball.x += ball.vx/n; ball.y += ball.vy/n;
      wallHit();
      rectHit(bx0, hy-78, BOARDW, 92, .58);
      circleHit(tX, hy, TIP_R, .62);
      for(const b of bars) rectHit(b.x, b.y, b.w, b.h, .5);
      if(ball.vy>0 && py < hy && ball.y >= hy && ball.x > lo+5 && ball.x < hi-5){ made=true; break; }
      if(ball.y + BR >= FLOOR){ done=true; break; }
    }
    if(done) break;
  }
  ball.x=sx; ball.y=sy; ball.vx=svx; ball.vy=svy;
  bars.forEach((b,i)=>b.x=bsave[i]);
  probing=false;
  return made;
}
/* (dx, dy yukarı) hedefine v hızıyla giden balistik açılar — 0, 1 veya 2 çözüm */
function ballisticAngles(dx, dy, v){
  const v2=v*v, disc = v2*v2 - G*(G*dx*dx + 2*dy*v2);
  if(disc < 0) return [];
  const r = Math.sqrt(disc), out = [];
  for(const s2 of [1,-1]){
    const th = Math.atan2(v2 + s2*r, G*Math.abs(dx));
    out.push(dx >= 0 ? -th : -(Math.PI - th));
  }
  return out;
}

/* Çemberin merkezine giden balistik çözümleri dener; hedefi duvarlara yansıtarak
   tek sekmeli sayı atışlarını da kapsar. Bir çözüm bulur bulmaz durur.
   Yanlış negatif zararsızdır: kurulum yalnızca çözüm BULUNDUĞUNDA kabul edilir. */
/* Çözümün etrafında pay var mı? */
function windowOk(ang, v){
  // Komşulardan en az biri de tutmalı: çözüm sayısal bir kıl payı olmasın.
  // Daha geniş pay aranmaz, çünkü oyuncu yörünge önizlemesiyle nişan alıyor —
  // isabet, kör hassasiyete değil, yayı görmeye dayanıyor.
  for(const [da, dv] of [[-.035,0], [.035,0], [0,-1.0], [0,1.0]]){
    if(probeShot(Math.cos(ang+da)*(v+dv), Math.sin(ang+da)*(v+dv))) return true;
  }
  return false;
}

function shotFeasible(){
  const hy = hoop.baseY, cx = (innerX() + (innerX() - hoop.side*rimLen()))/2;
  const y0 = ball.y - 2;
  const targets = [cx, 2*PL - cx, 2*PR - cx];   // doğrudan, sol duvardan, sağ duvardan
  for(let pass=0; pass<2; pass++){
    const jit = pass ? [-.10, .10] : [0];
    for(const tx of targets){
      const dx = tx - ball.x, dy = y0 - hy;
      for(let v=15; v<=30; v+=1.5){
        for(const ang of ballisticAngles(dx, dy, v)){
          for(const da of jit){
            const a2 = ang + da;
            if(probeShot(Math.cos(a2)*v, Math.sin(a2)*v) && windowOk(a2, v)) return true;
          }
        }
      }
      if(pass===0 && tx!==cx) break;   // ilk turda yalnız doğrudan hedef
    }
  }
  return false;
}

/* relax: 0 = tam zorluk, arttıkça kurulum kademeli kolaylaşır */
function buildShot(relax){
  const C = court();
  const side = rand() < .5 ? 1 : -1;
  const high = (C.n==='YÜKSEK' || C.n==='FIRTINA') && relax < 2;
  hoop = {
    side,
    baseY: high ? rnd(366, 468) : rnd(424, 562) + relax*18,
    amp: C.move && relax < 3 ? rnd(C.move*.6, C.move) * (1 - relax*.28) : 0,
    spd: rnd(.013, .024),
    ph: rand()*6.283,
  };
  const bx = side > 0 ? rnd(PL+34, 214) : rnd(206, PR-34);
  ball = {x:bx, y:FLOOR-BR, px:bx, py:FLOOR-BR, rx:bx, ry:FLOOR-BR, vx:0, vy:0};

  // Engel yolu tamamen kapatmaz: süpürdüğü alanın bir yanında en az CORRIDOR
  // genişliğinde açık koridor kalır ve potanın hemen altındaki şeride girmez.
  bars.length = 0;
  const CORRIDOR = 132;
  const nBars = relax >= 2 ? 0 : C.bars;
  for(let i=0;i<nBars;i++){
    const amp = rnd(20, 56);
    const maxW = (PR-PL) - CORRIDOR - amp*2 - 12;
    const w = clamp(rnd(80, 132) - relax*14, 60, maxW);
    if(w < 60) continue;
    // potanın altındaki dikey şeridi boş bırakmak için engeli karşı yana yasla
    const lo = PL + 6 + amp, hi = PR - 6 - amp - w;
    if(hi <= lo) continue;
    const x0 = side > 0 ? rnd(lo, Math.min(hi, PR - CORRIDOR - amp - w))
                        : rnd(Math.max(lo, PL + CORRIDOR + amp), hi);
    bars.push({bx:x0, x:x0, y:rnd(548, 706), w, h:13,
               amp, spd:rnd(.012,.020)*(rand()<.5?-1:1), ph:rand()*6.283});
  }
}

function newShot(){
  // İMKÂNSIZ TUR ÜRETİLMEZ: kurulum çözülebilir olana kadar kademeli gevşetilir.
  // Arama bütçelidir; bütçe biterse doğrudan en gevşek (engelsiz, salınımsız, alçak
  // pota) kuruluma geçilir. Böylece tur başına kare atlatacak bir gecikme oluşmaz.
  probeUntil = performance.now() + PROBE_MS;
  let found = false;
  for(let relax=0; relax<=3 && !found; relax++){
    for(let attempt=0; attempt<3; attempt++){
      buildShot(relax);
      if(shotFeasible()){ found = true; break; }
      if(performance.now() > probeUntil) break;
    }
  }
  if(!found){
    // bütçe bitti ya da hiçbiri tutmadı: engelsiz, salınımsız, alçak pota
    probeUntil = performance.now() + 6;
    for(let k=0;k<4;k++){ buildShot(4); if(shotFeasible()) break; }
    relaxed++;
  }

  orbs.length = 0;
  const nOrb = rand() < .34 ? 1 : 0;
  for(let i=0;i<nOrb;i++){
    const r = rand();
    const type = r < .42 ? 'time' : r < .72 ? 'wide' : 'double';
    for(let k=0;k<10;k++){
      const ox = rnd(PL+46, PR-46), oy = rnd(hoop.baseY-90, FLOOR-190);
      if(Math.abs(ox - innerX()) < 70 && Math.abs(oy - hoop.baseY) < 110) continue;
      if(bars.some(b=>Math.abs(b.y-oy)<58 && ox > b.bx-b.amp-40 && ox < b.bx+b.w+b.amp+40)) continue;
      orbs.push({type, x:ox, y:oy, ph:rand()*6.283});
      break;
    }
  }

  scored=false; hitRim=false; hitBoard=false; flightT=0;
  phase='aim'; aim=null; buffered=false; trail.length=0;
}

function resetRun(){
  parts.length=0; rings.length=0; floats.length=0; nets.length=0;
  score=0; baskets=0; streak=0; bestStreakRun=0; timeLeft=START_TIME;
  shots=0; swishes=0; elCombo.classList.remove('on');
  tick=0; shake=0; slow=0; flashA=0; sweep=0; vig=0;
  wideShots=0; airShots=0; urgentAt=99;
  ci=0; ciPrev=0; cMix=1; applyCourt(); syncPower();
  srand((Date.now()^(Math.random()*0xffffffff))>>>0);
  hoop = {side:1, baseY:490, amp:0, spd:.02, ph:0};
  newShot();
}

/* ================= fizik ================= */
function wallHit(){
  if(ball.x-BR < PL){ ball.x=PL+BR; if(ball.vx<-3 && !probing){ dust(PL+BR,ball.y,3,ink,1.6); Snd.wall(); }
    ball.vx=Math.abs(ball.vx)*.68; }
  else if(ball.x+BR > PR){ ball.x=PR-BR; if(ball.vx>3 && !probing){ dust(PR-BR,ball.y,3,ink,1.6); Snd.wall(); }
    ball.vx=-Math.abs(ball.vx)*.68; }
}

function rectHit(rx, ry, rw, rh, bounce){
  const cx=clamp(ball.x, rx, rx+rw), cy=clamp(ball.y, ry, ry+rh);
  const dx=ball.x-cx, dy=ball.y-cy;
  if(dx*dx+dy*dy > BR*BR) return false;
  const d=Math.hypot(dx,dy);
  let nx,ny,depth;
  if(d>0){ nx=dx/d; ny=dy/d; depth=BR-d; }
  else{
    const faces=[{v:ball.x-rx,x:-1,y:0},{v:rx+rw-ball.x,x:1,y:0},
      {v:ball.y-ry,x:0,y:-1},{v:ry+rh-ball.y,x:0,y:1}];
    const face=faces.reduce((a,b)=>a.v<b.v?a:b);
    nx=face.x;ny=face.y;depth=BR+face.v;
  }
  ball.x+=nx*depth; ball.y+=ny*depth;
  const vn=ball.vx*nx+ball.vy*ny;
  if(vn<0){ball.vx-=(1+bounce)*vn*nx;ball.vy-=(1+bounce)*vn*ny;}
  return true;
}

function circleHit(cx, cy, cr, bounce){
  const dx=ball.x-cx, dy=ball.y-cy, d=Math.hypot(dx,dy), rr=BR+cr;
  if(d > rr || d === 0) return false;
  const nx=dx/d, ny=dy/d;
  ball.x = cx + nx*rr; ball.y = cy + ny*rr;
  const vn = ball.vx*nx + ball.vy*ny;
  if(vn<0){
    ball.vx -= (1+bounce)*vn*nx;
    ball.vy -= (1+bounce)*vn*ny;
  }
  return true;
}

/* ================= atış çözümü ================= */
function madeBasket(){
  if(scored) return;
  scored = true;
  const swish = !hitRim && !hitBoard;
  if(swish) swishes++;
  baskets++;
  streak++;
  bestStreakRun = Math.max(bestStreakRun, streak);
  const mult = 1 + Math.min(3, Math.floor(streak/3));
  const pts = (swish ? 3 : 2) * mult;
  score += pts;
  timeLeft = Math.min(99, timeLeft + (swish ? T_SWISH : T_BASKET));

  const hy = hoopY();
  netWave(swish ? 1.4 : 1);
  ring(ball.x, hy, swish ? MINT : ink);
  burst(ball.x, hy, swish ? MINT : AMBER, swish ? 26 : 16);
  addShake(swish ? 6 : 3.5);
  floater(ball.x, hy-34, '+'+pts, swish ? MINT : ink, true);
  elScore.classList.add('bump'); setTimeout(()=>elScore.classList.remove('bump'), 120);

  if(swish){ Snd.swish(); Snd.perfect(); flash(MINT,.26); toast('TEMİZ ATIŞ  +'+pts, true, 1400); buzz([12,30,12]); }
  else { Snd.basket(streak); buzz(16); }
  if(streak>=3){
    elCombo.textContent = 'seri ×'+mult;
    elCombo.classList.add('on');
    if(streak%3===0) toast('SERİ ×'+mult, true, 1500);
  }

  const c = courtAt(baskets);
  if(c !== ci){
    ciPrev=ci; ci=c; cMix=0;
    toast(COURTS[c].n, true, 2200); Snd.zone(); addShake(3); sweep=1; flash(MINT,.2);
  }
  endShot(true);
}

function endShot(made){
  if(phase === 'end') return;
  phase = 'end';
  endT = made ? .8 : .55;
  if(!made){
    streak = 0;
    elCombo.classList.remove('on');
    Snd.miss();
    floater(ball.x, ball.y-30, 'KAÇTI', CORAL);
  }
  if(wideShots > 0){ wideShots--; syncPower(); }
  aim=null; aimId=null; buffered=false;
}

/* ================= adım ================= */
function step(){
  tick++;
  if(ball) ball.squash=(ball.squash||0)*.76;
  shake *= reduceMotion ? .55 : .86;
  if(slow>0) slow--;
  if(flashA>0){ flashA*=.84; if(flashA<.01) flashA=0; }
  if(sweep>0){ sweep-=.022; if(sweep<0) sweep=0; }
  if(cMix<1){ cMix=Math.min(1, cMix+.014); if(tick%2===0||cMix===1) applyCourt(); }

  for(const b of bars){ b.x = b.bx + Math.sin(tick*b.spd + b.ph)*b.amp; }
  for(let i=nets.length-1;i>=0;i--){ nets[i].t -= .045; if(nets[i].t<=0) nets.splice(i,1); }

  if(state==='play' && mode==='arcade'){
    timeLeft -= STEP/1000;
    if(timeLeft <= 10 && timeLeft > 0){
      const s = Math.ceil(timeLeft);
      if(s < urgentAt){ urgentAt = s; if(s<=5) Snd.urgent(); }
    }
    if(timeLeft <= 0){ timeLeft = 0; if(phase!=='fly'){ gameOver(); return; } }
  }

  if(ball && (phase==='fly' || phase==='end')){
    ball.rx = ball.x; ball.ry = ball.y;
    if(!reduceMotion){ trail.push({x:ball.x,y:ball.y}); if(trail.length>10) trail.shift(); }
    flightT += STEP/1000;
    ball.vy += G;
    ball.vx += windNow();
    ball.vx = clamp(ball.vx,-MAXV,MAXV); ball.vy = clamp(ball.vy,-MAXV,MAXV);
    const sp = Math.hypot(ball.vx, ball.vy), n = Math.max(1, Math.ceil(sp/4));
    const hy = hoopY(), bx0 = boardX(), inX = innerX(), tX = tipX();
    const lo = Math.min(tX, inX), hi = Math.max(tX, inX);

    for(let i=0;i<n;i++){
      ball.px = ball.x; ball.py = ball.y;
      ball.x += ball.vx/n; ball.y += ball.vy/n;
      wallHit();

      // panya
      if(rectHit(bx0, hy-78, BOARDW, 92, .58)){
        if(!hitBoard){ hitBoard=true; Snd.board(); dust(ball.x,ball.y,4,GREY,1.8); addShake(1.6); }
      }
      // çember ucu
      if(circleHit(tX, hy, TIP_R, .62)){
        if(!hitRim){ hitRim=true; Snd.rim(); ring(tX,hy,CORAL); addShake(2.2); }
      }
      // engeller
      for(const b of bars) rectHit(b.x, b.y, b.w, b.h, .5);

      // basket: çember düzlemini aşağı doğru geçiş
      if(phase==='fly' && ball.vy>0 && ball.py < hy && ball.y >= hy &&
         ball.x > lo+5 && ball.x < hi-5){
        madeBasket();
      }

      // güçlendirme küreleri
      for(const o of orbs){
        if(o.taken) continue;
        const oy=o.y+(reduceMotion?0:Math.sin(tick*.045+o.ph)*5);
        const dx=ball.x-o.x, dy=ball.y-oy;
        if(dx*dx+dy*dy < (BR+15)*(BR+15)) grab(o);
      }

      // zemin
      if(ball.y + BR >= FLOOR){
        ball.y = FLOOR - BR;
        const impact = ball.vy;
        ball.vy = -Math.abs(ball.vy)*.42; ball.vx *= .82;
        if(impact > 2){ ball.squash=Math.min(.28,impact*.012); Snd.dribble(); dust(ball.x, FLOOR, 5, GREY, 2.2); addShake(Math.min(2.5, impact*.1)); }
        if(Math.abs(ball.vy) < 1.6){ ball.vy = 0; ball.y = FLOOR - BR; }
        if(phase==='fly') endShot(false);
      }
    }
    if(phase==='fly' && flightT > 6) endShot(false);
  }

  if(phase==='end'){
    endT -= STEP/1000;
    if(endT <= 0 && state==='play') newShot();
  }

  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i]; q.vy+=(q.g==null?.28:q.g); q.x+=q.vx; q.y+=q.vy; q.vx*=.98; q.life-=q.dec;
    if(q.life<=0) parts.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){ const q=rings[i]; q.r+=3.4; q.life-=.055; if(q.life<=0) rings.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ const q=floats[i]; q.y-=.9; q.life-=.016; if(q.life<=0) floats.splice(i,1); }
}

  Snd.buzzer(); buzz([60,40,80]); addShake(9); flash(CORAL,.3);
  aim=null; aimId=null; buffered=false;

  save.bestBaskets = Math.max(save.bestBaskets, baskets);
  }
  persist();
  if(newRecord){
    setTimeout(()=>Snd.record(), 300);

const ptr = {x:0, y:0};
const MAXPULL = () => Math.min(W,H)*.26;
function launchVec(){
  if(!aim) return {x:0,y:0,t:0};
  const dx=aim.sx-aim.x, dy=aim.sy-aim.y;
  const len=Math.hypot(dx,dy), mp=MAXPULL();
  if(len<1) return {x:0,y:0,t:0};
  const t=Math.min(1, len/mp);
  const power = PULL_MIN + t*PULL_MAX;
  return {x:dx/len*power, y:dy/len*power, t};
}
function startAim(x,y){ aim={sx:x, sy:y, x:x, y:y, lt:0}; }

cvs.addEventListener('pointerdown', e=>{
  Snd.resume();
  ptr.x=e.clientX; ptr.y=e.clientY;
  if(state==='over-anim'){ showOver(); return; }
  if(state!=='play') return;
  if(aimId!==null) return;
  aimId=e.pointerId;
  try{ cvs.setPointerCapture(e.pointerId); }catch(err){}
  if(phase==='aim' || (phase==='fly' && airShots>0)) startAim(e.clientX, e.clientY);
  else buffered = true;
});
cvs.addEventListener('pointermove', e=>{
  if(e.pointerId!==aimId) return;
  ptr.x=e.clientX; ptr.y=e.clientY;
  if(!aim) return;
  aim.x=e.clientX; aim.y=e.clientY;
  const t=launchVec().t;
  if(Math.abs(t-aim.lt)>.1){ aim.lt=t; Snd.stretch(t); }
});
function release(e){
  if(e && aimId!==null && e.pointerId!==aimId) return;
  aimId=null; buffered=false;
  if(!aim) return;
  const v = launchVec();
  const air = phase==='fly' && airShots>0;
  if(v.t>.08 && (phase==='aim' || air)){
    ball.vx=v.x; ball.vy=v.y;
    if(air){
      airShots--;
      burst(ball.x, ball.y, VIOLET, 14); ring(ball.x, ball.y, VIOLET);
      Snd.airshot(); addShake(3); syncPower();
    }else{
      shots++; phase='fly'; flightT=0; ball.y-=2; ball.rx=ball.x; ball.ry=ball.y;
      dust(ball.x, FLOOR, 6, GREY, 2.6);
      if(!save.taught){ save.taught=true; persist(); }
    }
    Snd.launch(v.t); buzz(8); addShake(v.t*1.6);
  }
  aim=null;
}
cvs.addEventListener('pointerup', release);
function cancelAim(e){
  if(e && aimId!==null && e.pointerId!==aimId) return;
  aim=null; aimId=null; buffered=false;
}
cvs.addEventListener('pointercancel', cancelAim);
cvs.addEventListener('lostpointercapture', cancelAim);
addEventListener('keydown', e=>{
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){
    if(state==='play'||state==='count') pauseGame(); else if(state==='paused') resumeGame();
  }
});

const BAND = 1400;
function rr(x,y,w,h,r){
  r=Math.min(r,h/2,w/2);
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawMotif(m,x,y,r,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.beginPath();
  if(m==='ring'){ ctx.lineWidth=r*.13; ctx.arc(0,0,r*.82,0,6.3); ctx.stroke(); }
  else if(m==='shard'){ ctx.moveTo(0,-r); ctx.lineTo(r*.5,r*.35); ctx.lineTo(-r*.42,r*.7); ctx.closePath(); ctx.fill(); }
  else if(m==='drip'){ ctx.moveTo(0,-r); ctx.quadraticCurveTo(r*.62,0,0,r); ctx.quadraticCurveTo(-r*.62,0,0,-r); ctx.fill(); }
  else if(m==='arc'){ ctx.lineWidth=r*.2; ctx.arc(0,0,r,-.5,2.1); ctx.stroke(); }
  else if(m==='crack'){ ctx.lineWidth=r*.14; ctx.moveTo(-r,-r*.6);
    for(let k=1;k<=5;k++) ctx.lineTo(-r+k*r*.4, -r*.6+(k%2?r*.5:0)+k*r*.16); ctx.stroke(); }
  else { ctx.moveTo(r*.2,-r); ctx.lineTo(-r*.35,r*.1); ctx.lineTo(r*.05,r*.1);
    ctx.lineTo(-r*.25,r); ctx.lineTo(r*.42,-r*.15); ctx.lineTo(0,-r*.15); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function drawParallax(){
  if(reduceMotion || quality<.5) return;
  const m = court().motif;
  ctx.strokeStyle=ink; ctx.fillStyle=ink; ctx.lineCap='round';
  for(const L of [{n:5,s:1.6,a:.032,d:.10},{n:7,s:1.0,a:.05,d:.22}]){
    ctx.globalAlpha=L.a;
    for(let i=0;i<L.n;i++){
      const h1=(i*2654435761)>>>0;
      const x = PL+18 + (h1%1000)/1000*(PR-PL-36);
      const y = ((((h1>>>10)%BAND) + tick*L.d) % BAND) - 250;
      const sc = L.s*(.7 + ((h1>>>20)%100)/220);
      drawMotif(m, x, y, 30*sc, ((h1>>>7)%628)/100);
    }
  }
  ctx.globalAlpha=1; ctx.lineCap='butt';
}

function drawHoop(tf){
  const hy = hoop.baseY + (hoop.amp ? Math.sin(tf*hoop.spd + hoop.ph)*hoop.amp : 0);
  const bx = boardX(), inX = innerX(), tX = tipX();
  const wide = wideShots > 0;

  // panya
  ctx.fillStyle = ink; ctx.globalAlpha = .9;
  rr(bx, hy-78, BOARDW, 92, 3); ctx.fill(); ctx.globalAlpha = 1;
  // panya hedef karesi
  ctx.strokeStyle = paper; ctx.lineWidth = 2.4; ctx.globalAlpha = .5;
  const sq = hoop.side>0 ? bx+2 : bx+BOARDW-2;
  ctx.beginPath(); ctx.moveTo(sq, hy-44); ctx.lineTo(sq, hy-6); ctx.stroke();
  ctx.globalAlpha = 1;

  // çember
  ctx.strokeStyle = wide ? AMBER : CORAL;
  ctx.lineWidth = 5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(inX, hy); ctx.lineTo(tX, hy); ctx.stroke();
  ctx.fillStyle = wide ? AMBER : CORAL;
  ctx.beginPath(); ctx.arc(tX, hy, TIP_R+1, 0, 6.3); ctx.fill();
  ctx.lineCap='butt';

  // file
  const wave = nets.length ? nets[nets.length-1] : null;
  const amp = wave ? Math.sin(wave.t*Math.PI)*10*wave.p : 0;
  const len = 30 + amp*1.4;
  ctx.strokeStyle = wide ? AMBER : CORAL; ctx.globalAlpha = .42; ctx.lineWidth = 1.5;
  ctx.beginPath();
  const a = Math.min(inX,tX), b = Math.max(inX,tX), span = b-a;
  for(let i=0;i<=5;i++){
    const t = i/5, x0 = a + span*t;
    const x1 = a + span*(.22 + t*.56);
    ctx.moveTo(x0, hy); ctx.quadraticCurveTo((x0+x1)/2 + amp*.4, hy+len*.6, x1, hy+len);
  }
  for(let r=1;r<=2;r++){
    const t = r/3, yy = hy + len*t, sh = span*(1-t*.44)/2, cxm = (a+b)/2;
    ctx.moveTo(cxm-sh, yy);
    ctx.quadraticCurveTo(cxm, yy + amp*.5, cxm+sh, yy);
  }
  ctx.stroke(); ctx.globalAlpha = 1;
}

function drawBall(bx, by){
  const sp = Math.hypot(ball.vx, ball.vy);
  // gölge
  const sh = clamp(1 - (FLOOR-by)/620, 0, 1);
  ctx.fillStyle = ink; ctx.globalAlpha = .10*sh;
  ctx.beginPath(); ctx.ellipse(bx, FLOOR-3, BR*(.7+sh*.5), 4.5, 0, 0, 6.3); ctx.fill();
  ctx.globalAlpha = 1;

  if(airShots>0){
    ctx.strokeStyle=VIOLET; ctx.globalAlpha=.6; ctx.lineWidth=2.4; ctx.setLineDash([4,7]);
    ctx.beginPath(); ctx.arc(bx, by, BR+13, tick*.03, tick*.03+6.283); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
  }
  const squash=reduceMotion?0:(ball.squash||0);
  const st = reduceMotion?0:clamp(sp/140, 0, .16);
  const ang = Math.atan2(ball.vy, ball.vx);
  const spin = reduceMotion?0:tick * .035 * (ball.vx>0?1:-1);
  ctx.save(); ctx.translate(bx, by);
  ctx.scale(1+squash,1-squash);
  ctx.rotate(ang); ctx.scale(1+st,1-st); ctx.rotate(-ang+spin);
  const skin=ctx.createRadialGradient(-6,-7,2,0,0,BR+2);
  skin.addColorStop(0,'#ffd394'); skin.addColorStop(.45,'#f7984a'); skin.addColorStop(1,'#c74d24');
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0,0,BR,0,6.3); ctx.fill();
  // basketbol çizgileri
  ctx.strokeStyle = '#2A1508'; ctx.lineWidth = 1.6; ctx.globalAlpha = .8;
  ctx.beginPath();
  ctx.moveTo(-BR,0); ctx.lineTo(BR,0);
  ctx.moveTo(0,-BR); ctx.lineTo(0,BR);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(-BR*1.15, 0, BR*.92, -.85, .85); ctx.stroke();
  ctx.beginPath(); ctx.arc( BR*1.15, 0, BR*.92, Math.PI-.85, Math.PI+.85); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.fillStyle=paper; ctx.globalAlpha=.4;
  ctx.beginPath(); ctx.arc(bx-BR*.34, by-BR*.36, BR*.2, 0, 6.3); ctx.fill();
  ctx.globalAlpha=1;
}

function drawAim(bx, by){
  const v = launchVec();
  if(v.t < .05) return;
  ctx.strokeStyle=ink; ctx.globalAlpha=.3; ctx.lineWidth=2.4; ctx.setLineDash([5,6]);
  ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx-v.x*6, by-v.y*6); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;

  const original=ball, savedBars=bars.map(b=>b.x), points=[];
  ball={x:original.x,y:original.y-(phase==='aim'?2:0),vx:v.x,vy:v.y};
  probing=true;
  try{
    let stop=false;
    for(let f=1;f<=70 && !stop;f++){
      const t=tick+f;
      ball.vy=clamp(ball.vy+G,-MAXV,MAXV);
      ball.vx=clamp(ball.vx+(court().wind?court().wind*Math.sin(t*.0042):0),-MAXV,MAXV);
      const hy=hoop.baseY+(hoop.amp?Math.sin(t*hoop.spd+hoop.ph)*hoop.amp:0);
      for(const b of bars) b.x=b.bx+Math.sin(t*b.spd+b.ph)*b.amp;
      const n=Math.max(1,Math.ceil(Math.hypot(ball.vx,ball.vy)/4));
      for(let j=0;j<n;j++){
        const py=ball.y;ball.x+=ball.vx/n;ball.y+=ball.vy/n;
        wallHit();
        const hit=rectHit(boardX(),hy-78,BOARDW,92,.58) || circleHit(tipX(),hy,TIP_R,.62) || bars.some(b=>rectHit(b.x,b.y,b.w,b.h,.5));
        const made=ball.vy>0 && py<hy && ball.y>=hy && ball.x>Math.min(tipX(),innerX())+5 && ball.x<Math.max(tipX(),innerX())-5;
        if(hit || made || ball.y+BR>=FLOOR){points.push({x:ball.x,y:ball.y,end:true,made});stop=true;break;}
      }
      if(!stop && f%3===0) points.push({x:ball.x,y:ball.y});
    }
  }finally{ball=original;bars.forEach((b,i)=>b.x=savedBars[i]);probing=false;}
  for(let i=0;i<points.length;i++){
    const p=points[i];ctx.globalAlpha=p.end?.75:Math.max(.1,.55-i*.018);
    ctx.fillStyle=ink;ctx.strokeStyle=p.made?MINT:ink;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(p.x,p.y,p.end?8:Math.max(1.5,3-i*.06),0,6.3);
    if(p.end) ctx.stroke();else ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle = v.t>.94 ? CORAL : MINT; ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.arc(bx,by,BR+8,-1.5708,-1.5708+6.283*v.t); ctx.stroke();
}

function drawHand(bx, by){
  const t=(tick%128)/128, e = t<.74 ? (1-Math.pow(1-t/.74,3)) : 0, d=86*e;
  const hx=bx+(bx<VW/2?1:-1)*d*.5, hy=by+d*.72, fade = t<.74?1:1-(t-.74)/.26;
  ctx.setLineDash([5,6]);
  ctx.strokeStyle='rgba('+paperC.join(',')+',.75)'; ctx.lineWidth=6; ctx.globalAlpha=fade*.8;
  ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(hx,hy); ctx.stroke();
  ctx.strokeStyle=ink; ctx.lineWidth=2.2; ctx.globalAlpha=fade*.5;
  ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(hx,hy); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha=fade; ctx.fillStyle='rgb('+paperC.join(',')+')';
  ctx.beginPath(); ctx.arc(hx,hy,14,0,6.3); ctx.fill();
  ctx.strokeStyle=ink; ctx.lineWidth=2.4; ctx.globalAlpha=fade*.75;
  ctx.beginPath(); ctx.arc(hx,hy,14,0,6.3); ctx.stroke(); ctx.globalAlpha=1;
  ctx.fillStyle=ink; ctx.globalAlpha=.6; ctx.textAlign='center';
  ctx.font='500 16px Outfit, system-ui, sans-serif';
  ctx.fillText('geri çek ve bırak', VW/2, by-56);
  ctx.globalAlpha=1;
}

function drawOrb(o, tf){
  if(o.taken) return;
  const c=PW[o.type].c, bob=reduceMotion?0:Math.sin(tf*.045+o.ph)*5, y=o.y+bob;
  const pulse=.5+.5*Math.sin(tf*.07+o.ph);
  ctx.globalAlpha=.16+pulse*.16; ctx.fillStyle=c;
  ctx.beginPath(); ctx.arc(o.x,y,24+pulse*5,0,6.3); ctx.fill();
  ctx.globalAlpha=.5+pulse*.35; ctx.strokeStyle=c; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(o.x,y,17,0,6.3); ctx.stroke();
  ctx.globalAlpha=1; ctx.fillStyle=c;
  ctx.beginPath(); ctx.arc(o.x,y,11,0,6.3); ctx.fill();
  ctx.strokeStyle=paper; ctx.fillStyle=paper; ctx.lineWidth=2; ctx.beginPath();
  if(o.type==='time'){
    ctx.arc(o.x,y,5.5,0,6.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.x,y-3.4); ctx.lineTo(o.x,y); ctx.lineTo(o.x+3,y+1.6); ctx.stroke();
  }else if(o.type==='wide'){
    ctx.moveTo(o.x-6,y+3); ctx.lineTo(o.x+6,y+3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.x-6,y+3); ctx.lineTo(o.x-3,y-3); ctx.moveTo(o.x+6,y+3); ctx.lineTo(o.x+3,y-3); ctx.stroke();
  }else{
    ctx.arc(o.x-3.4,y,2.3,0,6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(o.x+3.4,y,2.3,0,6.3); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function draw(alpha){
  const tf = tick - (state==='play'?1-alpha:0);
  const sh = shake>.4 ? shake : 0;
  const sx = sh ? (Math.random()*2-1)*sh : 0, sy = sh ? (Math.random()*2-1)*sh : 0;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = ink; ctx.fillRect(0,0,W,H);
  ctx.setTransform(DPR*S,0,0,DPR*S,(offX+sx)*DPR,(offY+sy)*DPR);

  ctx.fillStyle = paper; ctx.fillRect(0,0,VW,VH);
  const ambient=ctx.createLinearGradient(0,160,VW,FLOOR);
  ambient.addColorStop(0,'rgba(255,255,255,.35)');ambient.addColorStop(1,'rgba(30,67,76,.1)');
  ctx.fillStyle=ambient;ctx.fillRect(PL,150,PR-PL,FLOOR-150);
  ctx.fillStyle=ink;ctx.globalAlpha=.035;ctx.font='700 104px Outfit,system-ui';ctx.textAlign='center';
  ctx.fillText('HOP',VW/2,330);ctx.fillText('UP.',VW/2,428);ctx.globalAlpha=1;
  drawParallax();

  // saha çizgileri — potanın altında üç sayı yayı ve boyalı alan
  if(hoop){
    const hx = hoop.side>0 ? PR : PL, s3 = hoop.side;
    ctx.strokeStyle = ink; ctx.lineWidth = 2.5; ctx.globalAlpha = .1;
    ctx.beginPath(); ctx.arc(hx, FLOOR, 268, s3>0 ? Math.PI : -Math.PI/2,
                                        s3>0 ? Math.PI*1.5 : 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx, FLOOR, 132, s3>0 ? Math.PI : -Math.PI/2,
                                        s3>0 ? Math.PI*1.5 : 0); ctx.stroke();
    ctx.globalAlpha = .06; ctx.lineWidth = 2;
    const kx = s3>0 ? PR-150 : PL, kw = 150;
    ctx.strokeRect(kx, FLOOR-104, kw, 104);
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = ink; ctx.globalAlpha = .05; ctx.lineWidth = 1;
  for(let y=190; y<FLOOR-120; y+=170){
    ctx.beginPath(); ctx.moveTo(PL, y+.5); ctx.lineTo(PR, y+.5); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // duvarlar
  ctx.fillStyle = ink;
  ctx.fillRect(0,0,PL,VH); ctx.fillRect(PR,0,VW-PR,VH);
  ctx.fillStyle = paper; ctx.globalAlpha = .18;
  for(let y=0;y<VH;y+=46){ ctx.fillRect(PL-4,y,3,20); ctx.fillRect(PR+1,y,3,20); }
  ctx.globalAlpha = 1;

  // zemin — parke
  ctx.fillStyle = ink; ctx.fillRect(0, FLOOR, VW, VH-FLOOR);
  ctx.fillStyle = paper; ctx.globalAlpha = .3;
  ctx.fillRect(0, FLOOR, VW, 2.5);
  ctx.globalAlpha = .12;
  for(let x=PL; x<PR; x+=26) ctx.fillRect(x, FLOOR+8, 1.6, VH-FLOOR-16);
  ctx.globalAlpha = .22; ctx.strokeStyle = paper; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(VW/2, FLOOR+2, 46, Math.PI, 0); ctx.stroke();
  ctx.globalAlpha = 1;

  for(const b of bars){
    ctx.fillStyle = CORAL; rr(b.x, b.y, b.w, b.h, 6); ctx.fill();
    ctx.fillStyle = paper; ctx.globalAlpha = .3;
    rr(b.x+5, b.y+3, b.w-10, 3, 2); ctx.fill(); ctx.globalAlpha = 1;
  }
  for(const o of orbs) drawOrb(o, tf);
  if(hoop) drawHoop(tf);

  for(const q of rings){
    ctx.globalAlpha=q.life*.5; ctx.strokeStyle=q.c; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,6.3); ctx.stroke();
  }
  for(const q of parts){
    ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.c;
    ctx.beginPath(); ctx.arc(q.x,q.y,q.s*q.life,0,6.3); ctx.fill();
  }
  ctx.globalAlpha=1;

  // HUD perdesi
  {
    const g=ctx.createLinearGradient(0,0,0,150);
    g.addColorStop(0,'rgba('+paperC.join(',')+',.95)');
    g.addColorStop(.62,'rgba('+paperC.join(',')+',.74)');
    g.addColorStop(1,'rgba('+paperC.join(',')+',0)');
    ctx.fillStyle=g; ctx.fillRect(PL,0,PR-PL,150);
  }

  if(ball && state!=='menu'){
    const bx = phase==='aim' ? ball.x : lerp(ball.rx, ball.x, alpha);
    const by = phase==='aim' ? ball.y : lerp(ball.ry, ball.y, alpha);
    if(!reduceMotion && phase!=='aim' && quality>.5){
      for(let i=0;i<trail.length;i++){
        ctx.globalAlpha=i/trail.length*.16;ctx.fillStyle=streak>=3?MINT:'#eb8a43';
        ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,BR*i/trail.length*.7,0,6.3);ctx.fill();
      }
      ctx.globalAlpha=1;
    }
    drawBall(bx, by);
    if(aim) drawAim(bx, by);
    else if(!save.taught && !reduceMotion && phase==='aim' && state==='play') drawHand(bx, by);
  }

  for(const q of floats){
    ctx.globalAlpha=Math.min(1,q.life*1.6); ctx.fillStyle=q.c; ctx.textAlign='center';
    ctx.font=(q.big?'700 22px':'600 15px')+' Outfit, system-ui, sans-serif';
    ctx.fillText(q.text, q.x, q.y);
  }
  ctx.globalAlpha=1;

  if(sweep>0){
    const yy=(1-sweep)*(VH+180)-90;
    const g=ctx.createLinearGradient(0,yy-90,0,yy+90);
    g.addColorStop(0,'rgba(46,216,168,0)');
    g.addColorStop(.5,'rgba(46,216,168,'+(sweep*.34).toFixed(3)+')');
    g.addColorStop(1,'rgba(46,216,168,0)');
    ctx.fillStyle=g; ctx.fillRect(PL,yy-90,PR-PL,180);
  }

  const vigT = Math.max(Math.min(streak,9)/9*.42,
                        state==='play' && mode==='arcade' && timeLeft<10 ? (1-timeLeft/10)*.55 : 0);
  vig += (vigT-vig)*.08;
  if(vig>.02 && !reduceMotion){
    const g=ctx.createRadialGradient(VW/2,VH*.5,VH*.24,VW/2,VH*.5,VH*.78);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1, timeLeft<10 ? 'rgba(255,77,94,'+(vig*.34).toFixed(3)+')'
                                  : 'rgba(0,0,0,'+(vig*.4).toFixed(3)+')');
    ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  }

  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(flashA>.01){
    const [r,g2,b2]=hex(flashC);
    ctx.fillStyle='rgba('+r+','+g2+','+b2+','+Math.min(.42,flashA).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
}

/* ================= döngü ================= */
let acc=0, last=performance.now(), frames=0, fpsT=performance.now(),
    shownScore=-1, shownTime=-1;

function loop(now){
  requestAnimationFrame(loop);
  let dt = now-last; last=now;
  if(dt>250) dt=STEP;
  const active = state==='play' || state==='over-anim';
  acc += Math.min(dt,100)*(slow>0?.34:1);
  let guard=0;
  while(acc>=STEP && guard++<5){ if(active) step(); acc-=STEP; }
  if(guard>=5) acc=0;

  frames++;
  if(now-fpsT>1000){
    fpsAvg=frames*1000/(now-fpsT); frames=0; fpsT=now;
    quality = fpsAvg<42 ? .4 : fpsAvg<52 ? .7 : 1;
    if(reduceMotion) quality=Math.min(quality,.35);
  }

  if(shownScore!==score){ shownScore=score; elScore.textContent=score; }
  const secs = Math.max(0, Math.ceil(timeLeft));
  if(shownTime!==secs){
    shownTime=secs;
    elSec.textContent = mode==='practice' ? 'ANTRENMAN' : secs===0 ? 'SON ATIŞ' : secs + '"';
    elSec.classList.toggle('low', mode==='arcade' && secs<=10);
    elBar.classList.toggle('low', mode==='arcade' && secs<=10);
  }
  elFill.style.transform = 'scaleX('+clamp(timeLeft/START_TIME,0,1).toFixed(4)+')';

  const next=COURTS[ci+1], start=COURTS[ci].from;
  const goal=next ? next.from : start+10;
  const journeyKey=mode+ci+':'+baskets+':'+streak;
  if(el('journey').dataset.key!==journeyKey){
    el('journey').dataset.key=journeyKey;
    el('courtLabel').textContent=(mode==='practice'?'ANTRENMAN · ':'')+court().n;
    el('goalLabel').textContent=next ? (next.from-baskets)+' basket sonra '+next.n.toLocaleLowerCase('tr') : 'Fırtınadasın · Serini büyüt!';
    el('goalFill').style.transform='scaleX('+clamp((baskets-start)/(goal-start),0,1)+')';
  }
  draw(active ? clamp(acc/STEP,0,1) : 0);
}

/* ================= başlangıç ================= */
applyCourt();
resetRun();
setState('menu');
requestAnimationFrame(loop);
})();
</script>
