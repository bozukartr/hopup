<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E7EBF0">
<meta name="description" content="SAPAN — geri çek, bırak, yukarı tırman. Tek parmakla oynanan sonsuz tırmanış oyunu.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SAPAN">
<title>SAPAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7EBF0;
    --ink:#1B2230;
    --paper-rgb:231,235,240;
    --ink-rgb:27,34,48;
    --mint:#2ED8A8;
    --amber:#F2B705;
    --ice:#69BFFF;
    --coral:#FF4D5E;
    --violet:#A97BE0;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--ink);
    font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none}
  canvas{display:block;position:fixed;inset:0}

  /* ---------- paneller ---------- */
  .sheet{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;
    padding:calc(var(--safe-t) + 24px) 28px calc(var(--safe-b) + 24px);
    background:rgba(var(--paper-rgb),.93);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    color:var(--ink);text-align:center;z-index:10;
    animation:fade .22s ease both;
  }
  .sheet.hide{display:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .mark{line-height:.86}
  .mark b{display:block;font-weight:700;font-size:clamp(52px,17vw,96px);letter-spacing:-.05em}
  .mark span{display:block;margin-top:10px;font-size:15px;font-weight:400;opacity:.62}

  .keys{display:grid;gap:10px;width:100%;max-width:300px}
  .key{display:flex;align-items:center;gap:12px;font-size:14.5px}
  .chip{width:34px;height:11px;border-radius:6px;flex:none;background:var(--ink)}
  .chip.b{background:var(--mint)} .chip.s{background:var(--amber)}
  .chip.c{background:var(--violet)}
  .orb{width:22px;height:22px;border-radius:50%;flex:none;margin-left:6px;margin-right:6px;
    background:var(--ink);box-shadow:0 0 0 3px rgba(var(--ink-rgb),.14)}
  .orb.k{background:var(--ice);box-shadow:0 0 0 3px rgba(105,191,255,.28)}
  .orb.s{background:var(--amber);box-shadow:0 0 0 3px rgba(242,183,5,.28)}
  .orb.c{background:var(--violet);box-shadow:0 0 0 3px rgba(169,123,224,.28)}
  .chip.d{background:var(--coral);height:12px;
    clip-path:polygon(0 100%,8% 0,16% 100%,24% 0,32% 100%,40% 0,48% 100%,56% 0,64% 100%,72% 0,80% 100%,88% 0,96% 100%)}
  .key i{font-style:normal;opacity:.5;font-size:13px;margin-left:auto}

  button{
    font-family:inherit;font-size:17px;font-weight:600;color:var(--paper);
    background:var(--ink);border:0;border-radius:100px;padding:16px 46px;cursor:pointer;
    transition:transform .12s ease;
  }
  button:active{transform:scale(.95)}
  button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
  button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(var(--ink-rgb),.22);
    padding:13px 34px;font-size:15px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}

  .tally{display:flex;gap:34px;align-items:flex-end}
  .tally div small{display:block;font-size:12.5px;opacity:.55;margin-bottom:2px}
  .tally div strong{font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .tally div.alt strong{font-size:26px;opacity:.5}
  .over-title{font-size:21px;font-weight:600}
  .over-sub{font-size:14px;opacity:.55;margin-top:-16px}
  .badge{font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
    background:var(--mint);color:var(--ink);padding:7px 14px;border-radius:100px;
    animation:pulse 1.1s ease-in-out infinite}
  .badge.hide{display:none}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:calc(var(--safe-t) + 10px);
    left:calc(var(--safe-l) + var(--play-l,10px));
    right:calc(var(--safe-r) + var(--play-r,10px));z-index:5;display:flex;align-items:flex-start;
    justify-content:space-between;pointer-events:none;color:var(--ink)}
  #hud.hide{display:none}
  .hbtn{pointer-events:auto;width:42px;height:42px;border-radius:100px;padding:0;
    background:rgba(var(--ink-rgb),.10);color:var(--ink);font-size:16px;font-weight:600;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .hbtn svg{width:17px;height:17px;fill:currentColor}
  #scoreWrap{text-align:center;line-height:1;padding-top:2px}
  #score{font-size:33px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
    display:block;transition:transform .1s ease}
  #score.bump{transform:scale(1.16)}
  #scoreWrap small{display:block;font-size:11px;font-weight:400;opacity:.42;margin-top:3px}
  #combo{display:block;font-size:13px;font-weight:600;color:#0E9E76;margin-top:5px;
    opacity:0;transition:opacity .15s ease}
  #combo.on{opacity:1}
  #power{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:9px}
  .pw{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;
    letter-spacing:.07em;padding:3px 8px 3px 4px;border-radius:100px;color:var(--ink);
    white-space:nowrap;background:rgba(var(--paper-rgb),.88);
    box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.13);
    animation:pwin .26s cubic-bezier(.2,1.5,.4,1) both}
  .pw b{width:10px;height:10px;border-radius:50%;display:block;flex:none}
  .pw.x{animation:pwout .3s ease both}
  @keyframes pwin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  @keyframes pwout{to{opacity:0;transform:scale(1.5)}}

  /* ---------- bildirim ---------- */
  #toast{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 142px);z-index:6;
    display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
  .tst{background:rgba(var(--ink-rgb),.9);color:var(--paper);font-size:13.5px;font-weight:500;
    padding:8px 18px;border-radius:100px;animation:tin .3s ease both;white-space:nowrap;
    max-width:88vw;overflow:hidden;text-overflow:ellipsis}
  .tst.big{font-size:15px;font-weight:600;letter-spacing:.06em}
  .tst.out{animation:tout .3s ease both}
  @keyframes tin{from{opacity:0;transform:translateY(-9px)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-9px)}}

  #count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:11;font-size:88px;font-weight:700;color:var(--ink);pointer-events:none;
    letter-spacing:-.04em}
  #count.hide{display:none}
  #count span{animation:cpop .7s ease both}
  @keyframes cpop{0%{transform:scale(.55);opacity:0}25%{transform:scale(1);opacity:1}
    75%{opacity:1}100%{transform:scale(1.25);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    button,.sheet,.tst,#count span,.badge{transition:none;animation:none}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hide">
  <button class="hbtn" id="btnPause" aria-label="Duraklat">
    <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4.4" height="16" rx="1.4"/><rect x="13.6" y="4" width="4.4" height="16" rx="1.4"/></svg>
  </button>
  <div id="scoreWrap">
    <span id="score" aria-live="off">0</span>
    <small>yükseklik</small>
    <span id="combo"></span>
    <span id="power"></span>
  </div>
  <button class="hbtn" id="btnSound" aria-label="Sesi aç veya kapat"><span id="sndIcon">♪</span></button>
</div>

<div id="toast"></div>
<div id="count" class="hide"></div>

<div class="sheet" id="menu">
  <div class="mark">
    <b>SAPAN</b>
    <span>Geri çek, bırak, yukarı tırman</span>
  </div>
  <div class="keys">
    <div class="key"><i class="chip"></i>Sade zemin<i>tutunur</i></div>
    <div class="key"><i class="chip b"></i>Zıplak<i>seni fırlatır</i></div>
    <div class="key"><i class="chip c"></i>Çürük<i>altından kaçar</i></div>
    <div class="key"><i class="chip d"></i>Diken<i>topu patlatır</i></div>
    <div class="key"><i class="orb k"></i>Kalkan<i>bir ölümü emer</i></div>
    <div class="key"><i class="orb s"></i>Roket<i>güçlü atış</i></div>
    <div class="key"><i class="orb c"></i>Çift atış<i>havada fırlat</i></div>
  </div>
  <div class="row">
    <button id="btnStart">Oyna</button>
  </div>
  <div class="row" id="menuStats" style="font-size:13px;opacity:.5"></div>
</div>

<div class="sheet hide" id="pause">
  <div class="mark"><b style="font-size:clamp(34px,10vw,54px)">DURDU</b></div>
  <div class="row">
    <button id="btnResume">Devam et</button>
  </div>
  <div class="row">
    <button class="ghost" id="btnQuit">Menüye dön</button>
  </div>
</div>

<div class="sheet hide" id="over">
  <div class="badge hide" id="recBadge">Yeni rekor</div>
  <div class="over-title" id="overTitle">Top patladı</div>
  <div class="over-sub" id="overSub"></div>
  <div class="tally">
    <div><small>Yükseklik</small><strong id="sc">0</strong></div>
    <div class="alt"><small>Rekor</small><strong id="bs">0</strong></div>
    <div class="alt"><small>En iyi seri</small><strong id="bc">0</strong></div>
  </div>
  <div class="row">
    <button id="btnAgain">Yeniden dene</button>
  </div>
  <div class="row">
    <button class="ghost" id="btnMenu">Menü</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= sabitler ================= */
const VW = 420;          // sanal dünya genişliği (birim) — her cihazda aynı
const VH = 900;          // hedef görünür yükseklik (birim)
const WALLW = 14;        // duvar kalınlığı (birim)
const PL = WALLW, PR = VW - WALLW;
const G = .62;           // yerçekimi (birim/kare²)
const MAXV = 32;
const BR = 15;           // top yarıçapı
const PULL_MIN = 5, PULL_MAX = 18;   // fırlatma gücü: 5 .. 23
const FALLBACK = .52;    // kamera en yüksek noktadan en fazla bu kadar geri iner
const STEP = 1000/60;

const INK='#1B2230', PAPER='#E7EBF0', MINT='#2ED8A8', AMBER='#F2B705',
      ICE='#69BFFF', CORAL='#FF4D5E', VIOLET='#A97BE0', GREY='#96A0B0';

const COLOR = {ground:INK, normal:INK, bouncy:MINT, crumble:VIOLET};
const FRIC  = {ground:.88, normal:.88, bouncy:.92, crumble:.86};
const TNAME = {normal:'Sade zemin', bouncy:'Zıplak zemin', crumble:'Çürük zemin'};
const THINT = {bouncy:'seni yukarı fırlatır', crumble:'bastıktan sonra kırılır'};

/* güçlendirmeler */
const PW = {
  shield: {c:ICE,    n:'KALKAN',    s:'KALKAN', h:'bir ölümü emer'},
  rocket: {c:AMBER,  n:'ROKET',     s:'ROKET',  h:'sonraki atış çok güçlü'},
  double: {c:VIOLET, n:'ÇİFT ATIŞ', s:'ÇİFT',   h:'havada bir kez daha fırlat'},
};
const PWKEYS = ['shield','rocket','double'];

/* bölgeler — yükseklik arttıkça dünya değişir */
const ZONES = [
  {n:'ZEMİN',    from:0,    paper:'#E7EBF0', ink:'#1B2230', wind:0,    types:['normal','bouncy'],           motif:'dot'},
  {n:'BUZ',      from:320,  paper:'#DCEAF3', ink:'#16303F', wind:0,    types:['normal','bouncy'],           motif:'shard'},
  {n:'REÇİNE',   from:780,  paper:'#F0E8DB', ink:'#33261A', wind:0,    types:['normal','bouncy','crumble'], motif:'drip'},
  {n:'RÜZGÂR',   from:1400, paper:'#E3ECE7', ink:'#1C3028', wind:.055, types:['normal','bouncy','crumble'], motif:'arc'},
  {n:'ÇÜRÜK KAT',from:2100, paper:'#EDE3EC', ink:'#2C1E30', wind:0,    types:['normal','bouncy','crumble'], motif:'crack'},
  {n:'FIRTINA',  from:2900, paper:'#D8DBE6', ink:'#14161F', wind:.085, types:['normal','bouncy','crumble'], motif:'bolt'},
];

/* ================= yardımcılar ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function mixRGB(a,b,t){
  const A=hex(a), B=hex(b);
  return [Math.round(lerp(A[0],B[0],t)), Math.round(lerp(A[1],B[1],t)), Math.round(lerp(A[2],B[2],t))];
}

/* tohumlanabilir rastgelelik — aynı tohum aynı dünyayı üretir */
let seed = 1;
function srand(s){ seed = (s>>>0) || 1; }
function rand(){
  seed ^= seed<<13; seed>>>=0; seed ^= seed>>17; seed ^= seed<<5; seed>>>=0;
  return seed/4294967296;
}
const rnd=(a,b)=>a+rand()*(b-a);
const pick=arr=>arr[(rand()*arr.length)|0];

/* ================= kayıt ================= */
const KEY='sapan.v2';
const save={best:0,bestCombo:0,runs:0,sound:true,haptics:true,seen:{},taught:false};
try{ const raw=localStorage.getItem(KEY); if(raw) Object.assign(save, JSON.parse(raw)); }catch(e){}
let saveTimer=0;
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(save)); }catch(e){} }, 120);
}

/* ================= ses ================= */
const Snd = (()=>{
  let ac=null, bus=null, noiseBuf=null;
  function ctxOf(){
    if(ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{
      ac = new AC();
      bus = ac.createGain(); bus.gain.value=.42; bus.connect(ac.destination);
      const n = ac.sampleRate*.35; noiseBuf = ac.createBuffer(1,n,ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
    }catch(e){ ac=null; }
    return ac;
  }
  function on(){ return save.sound && ctxOf(); }
  function resume(){ const a=ctxOf(); if(a && a.state==='suspended') a.resume().catch(()=>{}); }
  function tone(f, dur, o){
    const a=on(); if(!a) return;
    o=o||{};
    const t=a.currentTime + (o.delay||0);
    const osc=a.createOscillator(), g=a.createGain();
    osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(f,t);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to), t+dur);
    const v=(o.vol==null?.22:o.vol);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(v, t+Math.min(.02,dur*.3));
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    osc.connect(g); g.connect(bus); osc.start(t); osc.stop(t+dur+.02);
  }
  function hiss(dur, vol, freq, q){
    const a=on(); if(!a) return;
    const t=a.currentTime;
    const src=a.createBufferSource(); src.buffer=noiseBuf;
    const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q||1;
    const g=a.createGain();
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(bus); src.start(t); src.stop(t+dur);
  }
  return {
    resume,
    stretch(t){ tone(180+t*260, .045, {type:'square', vol:.045, to:200+t*300}); },
    launch(t){ tone(300+t*120, .16, {type:'triangle', vol:.16, to:90}); hiss(.09,.06,900,1.2); },
    land(){ tone(150, .09, {type:'sine', vol:.13, to:95}); hiss(.05,.05,700,1.4); },
    bounce(p){ tone(320+p*220, .2, {type:'sine', vol:.2, to:760+p*260}); },
    wall(){ tone(210, .05, {type:'square', vol:.05, to:150}); },
    crack(){ hiss(.14,.09,1500,2); tone(180,.1,{type:'square',vol:.07,to:80}); },
    near(){ tone(1250, .1, {type:'sine', vol:.1, to:1750}); },
    grab(){ [660,880,1320].forEach((f,i)=>tone(f,.2,{type:'triangle',vol:.13,delay:i*.05})); },
    rocket(){ tone(160,.42,{type:'sawtooth',vol:.18,to:900}); hiss(.34,.16,1500,.8); },
    airshot(){ tone(520,.16,{type:'triangle',vol:.14,to:980}); },
    shieldBreak(){ hiss(.3,.18,2600,1.6); tone(900,.26,{type:'sine',vol:.14,to:300}); },
    combo(n){ tone(430*Math.pow(1.09, Math.min(n,14)), .11, {type:'triangle', vol:.12}); },
    zone(){ [0,.09,.18].forEach((d,i)=>tone([392,523,659][i], .5, {type:'sine', vol:.11, delay:d})); },
    record(){ [523,659,784,1047].forEach((f,i)=>tone(f,.28,{type:'triangle',vol:.14,delay:i*.085})); },
    pop(){ hiss(.34,.24,420,.7); tone(150,.3,{type:'sawtooth',vol:.14,to:45}); },
    fall(){ tone(420,.5,{type:'sine',vol:.15,to:70}); },
    tick(){ tone(760,.06,{type:'square',vol:.07}); },
  };
})();
function buzz(ms){ if(save.haptics && navigator.vibrate) { try{ navigator.vibrate(ms); }catch(e){} } }

/* ================= görüntü ================= */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', {alpha:false});
let W=0, H=0, DPR=1, S=1, offX=0, visH=VH;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
  cvs.style.width = W+'px'; cvs.style.height = H+'px';
  S = Math.min(W/VW, H/VH);
  offX = (W - VW*S)/2;
  visH = H/S;                       // görünür dünya yüksekliği (birim)
  const st=document.documentElement.style;
  st.setProperty('--play-l', Math.round(offX + PL*S + 6)+'px');
  st.setProperty('--play-r', Math.round(W - offX - PR*S + 6)+'px');
}
resize();
/* ÖNEMLİ: yeniden boyutlanma koşuyu ASLA sıfırlamaz — dünya birim tabanlı */
addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize,120));

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= dünya durumu ================= */
let state='menu';
let ball=null, plats=[], parts=[], rings=[], floats=[];
let cam=0, camBest=0, nextY=0, score=0, tick=0, shake=0;
let combo=0, comboBest=0, landY=0, lastPlat=null;
let zi=0, ziPrev=0, zMix=1, paper=PAPER, ink=INK, paperC=hex(PAPER);
let aim=null, aimId=null, buffered=false;
let deadCause='', deadAt=0, slow=0, quality=1, fpsAvg=60;
let overTimer=0, countTimer=0;

const el = id=>document.getElementById(id);
const elScore=el('score'), elCombo=el('combo'), elHud=el('hud'), elToast=el('toast'),
      elCount=el('count'), elMenu=el('menu'), elPause=el('pause'), elOver=el('over');

/* ================= zorluk & bölge ================= */
const diff = h => Math.log1p(Math.max(0,h)/420)/3.2;   // doyuma ulaşmaz, sürekli artar
function zoneAt(h){ let i=0; for(let k=0;k<ZONES.length;k++) if(h>=ZONES[k].from) i=k; return i; }

function applyZone(){
  const Z=ZONES[zi], P=ZONES[ziPrev], t=Math.min(zMix,1);
  paperC = mixRGB(P.paper, Z.paper, t);
  const inkC = mixRGB(P.ink, Z.ink, t);
  paper = 'rgb('+paperC.join(',')+')';
  ink   = 'rgb('+inkC.join(',')+')';
  const st=document.documentElement.style;
  st.setProperty('--paper', paper);       st.setProperty('--paper-rgb', paperC.join(','));
  st.setProperty('--ink', ink);           st.setProperty('--ink-rgb', inkC.join(','));
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=paper;
}
function windNow(){
  const Z=ZONES[zi];
  return Z.wind ? Z.wind*Math.sin(tick*.0042) : 0;
}

/* ================= bildirimler ================= */
function toast(text, big, ms){
  const d=document.createElement('div');
  d.className='tst'+(big?' big':'');
  d.textContent=text;
  elToast.appendChild(d);
  setTimeout(()=>{ d.classList.add('out'); setTimeout(()=>d.remove(),320); }, ms||1700);
  while(elToast.children.length>3) elToast.firstChild.remove();
}

/* ================= efektler ================= */
function dust(x,y,n,c,spread){
  n = Math.round(n*quality); if(n<=0) return;
  for(let i=0;i<n;i++) parts.push({x,y,vx:rnd(-spread,spread),vy:rnd(-2.4,-.2),
    life:1,dec:rnd(.02,.045),s:rnd(2,4.6),c});
  if(parts.length>320) parts.splice(0, parts.length-320);
}
function ring(x,y,c){ if(quality>.35) rings.push({x,y,r:8,life:1,c}); }
function burst(x,y,c,n){
  n = Math.round(n*quality); if(n<=0) return;
  for(let i=0;i<n;i++){
    const a = (i/n)*6.283 + rand()*.5, sp = rnd(1.8,6.2);
    parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - .6,
      life:1, dec:rnd(.016,.034), s:rnd(2,5), c, g:.12});
  }
  if(parts.length>360) parts.splice(0, parts.length-360);
}
let flashC=null, flashA=0, sweep=0, vig=0;
function flash(c, a){ if(reduceMotion) return; flashC=c; flashA=Math.max(flashA, a); }
function floater(x,y,text,c){ floats.push({x,y,text,c,life:1}); if(floats.length>10) floats.shift(); }
function addShake(v){ if(!reduceMotion) shake=Math.min(16, shake+v); }

/* ================= güçlendirmeler ================= */
function syncPower(){
  if(!ball){ el('power').innerHTML=''; return; }
  const on=[];
  if(ball.shield) on.push('shield');
  if(ball.rocket) on.push('rocket');
  if(ball.airShots>0) on.push('double');
  const want = on.map(k=>k+(k==='double'&&ball.airShots>1?ball.airShots:'')).join(',');
  if(el('power').dataset.k === want) return;
  el('power').dataset.k = want;
  el('power').innerHTML = on.map(k=>{
    const n = k==='double' && ball.airShots>1 ? PW[k].s+' ×'+ball.airShots : PW[k].s;
    return '<span class="pw"><b style="background:'+PW[k].c+'"></b>'+n+'</span>';
  }).join('');
}

function grab(o){
  o.taken = true;
  const c = PW[o.type].c;
  if(o.type==='shield') ball.shield = true;
  else if(o.type==='rocket') ball.rocket = true;
  else ball.airShots = Math.min(3, ball.airShots + 1);

  burst(o.x, o.y, c, 18);
  ring(o.x, o.y, c); ring(o.x, o.y, c);
  flash(c, .22);
  floater(o.x, o.y-18, PW[o.type].n, c);
  addShake(2.6); Snd.grab(); buzz(12);
  syncPower();
  if(!save.seen['pw_'+o.type]){
    save.seen['pw_'+o.type] = true; persist();
    toast(PW[o.type].n + ' — ' + PW[o.type].h, false, 2600);
  }
}

/* kalkan bir ölümü emer; kurtarmanın bedeli, ulaştığın en yüksek noktayı kaybetmen */
function useShield(cause){
  ball.shield = false; ball.inv = 70;
  burst(ball.x, ball.y, ICE, 26);
  ring(ball.x, ball.y, ICE); ring(ball.x, ball.y, ICE);
  flash(ICE, .38); addShake(9); Snd.shieldBreak(); buzz([18,40,18]);
  floater(ball.x, ball.y-30, 'KALKAN KIRILDI', ICE);
  if(cause==='fall'){
    camBest = ball.y - visH*.5; cam = camBest;
    ball.vy = -17;
  }else{
    ball.vy = -15; ball.vx *= .5;
  }
  syncPower();
}

/* ================= üretim ================= */
const recent=[];   // son yerleştirilen platformlar (diken doğrulaması için)

function typeFor(z, d){
  const list = ZONES[z].types;
  const w = list.map(t=>{
    if(t==='normal')  return 50 - d*10;
    if(t==='bouncy')  return 26 + d*4;
    if(t==='crumble') return 6 + d*16;
    return 10;
  });
  let sum=0; for(const v of w) sum+=v;
  let r=rand()*sum;
  for(let i=0;i<list.length;i++){ r-=w[i]; if(r<=0) return list[i]; }
  return list[0];
}

/* v hızıyla (dx yatay, dy yukarı) noktasına ulaşılabilir mi? */
function reachable(dx, dy, v){
  const v2=v*v;
  return v2*v2 - G*(G*dx*dx + 2*dy*v2) >= 0;
}
function freeOfPlatforms(x, w, y, pad){
  for(const p of recent){
    if(Math.abs(p.y - y) > 46) continue;
    if(!(x + w < p.x - pad || x > p.x + p.w + pad)) return false;
  }
  return true;
}

function row(y){
  const h = Math.round(-y/12);
  const d = diff(h);
  const z = zoneAt(h);

  const w = clamp(rnd(76,126) - d*40, 46, 132);
  const type = typeFor(z, d);
  const p = {kind:'plat', type, y, h:14, w, x:rnd(PL+6, PR-6-w), px:0};

  // hareketli platform (öğretme bölgesinde yok)
  if(z>0 && rand() < Math.min(.44, d*.52)){
    if(rand()<.72){
      const room=(PR-PL-w)/2-6;
      const amp=Math.min(rnd(30,96), room);
      if(amp>14){
        p.move='h'; p.amp=amp; p.spd=rnd(.010,.020)*(rand()<.5?-1:1);
        p.ph=rand()*6.283; p.bx=rnd(PL+amp+4, PR-w-amp-4); p.x=p.bx;
      }
    }else{
      p.move='v'; p.amp=rnd(22,56); p.spd=rnd(.011,.019); p.ph=rand()*6.283; p.by=y;
    }
  }
  p.px=p.x;
  clearOrbs(p.move==='h' ? p.bx-p.amp : p.x, p.move==='h' ? p.w+p.amp*2 : p.w, y);
  plats.push(p);
  recent.push(p); if(recent.length>6) recent.shift();

  if(z===0) return;   // ZEMİN bölgesi tehlikesiz: oyuncu önce mekaniği öğrensin

  // yukarı bakan diken — hiçbir platformla çakışmamalı
  if(rand() < Math.min(.5, d*.72)){
    const sw=rnd(46,96);
    for(let i=0;i<10;i++){
      const sx=rnd(PL+4, PR-4-sw), sy=y+rnd(-26,26);
      if(freeOfPlatforms(sx, sw, sy, 34)){
        clearOrbs(sx, sw, sy);
        plats.push({kind:'spike', dir:'up', x:sx, y:sy, w:sw, h:11});
        break;
      }
    }
  }
  // duvar dikeni — ESKİ HATA: platformla çakışabiliyordu, artık doğrulanıyor
  if(rand() < Math.min(.26, d*.36)){
    const hh=rnd(52,116), left=rand()<.5;
    const sx = left ? PL : PR-13, sy = y+rnd(-40,40);
    if(freeOfPlatforms(sx, 13, sy, 22)){
      for(let yy=sy; yy<sy+hh; yy+=30) clearOrbs(sx, 13, yy);
      plats.push({kind:'spike', dir:left?'right':'left', x:sx, y:sy, w:13, h:hh});
    }
  }

  // güçlendirme küresi — boş havada, hafif bir sapma gerektirecek yerde
  if(rand() < .085){
    const rr2 = rand();
    const type = rr2 < .22 ? 'shield' : rr2 < .61 ? 'rocket' : 'double';
    for(let i=0;i<8;i++){
      const ox = rnd(PL+26, PR-26), oy = y - rnd(46, 104);
      let clear = true;
      for(const q of plats){
        if(Math.abs(q.y-oy) > 60) continue;
        const qw = q.kind==='orb' ? 30 : q.w;
        if(!(ox+30 < q.x - 8 || ox-30 > q.x + qw + 8)) { clear = false; break; }
      }
      if(clear){ plats.push({kind:'orb', type, x:ox, y:oy, w:0, h:0, ph:rand()*6.283}); break; }
    }
  }
}

/* bu satırda yerleştirilen bir şey daha önce konmuş bir küreyi yutuyorsa küreyi kaldır */
function clearOrbs(x, w, y){
  for(let i=plats.length-1;i>=0;i--){
    const o=plats[i];
    if(o.kind!=='orb') continue;
    if(Math.abs(o.y-y) > 44) continue;
    if(!(o.x+18 < x-6 || o.x-18 > x+w+6)) plats.splice(i,1);
  }
}

function grow(){
  let guard=0;
  while(nextY > cam - visH*.95 && guard++ < 60){
    row(nextY);
    const h=Math.round(-nextY/12), d=diff(h);
    let gap = rnd(126,158) + d*48;
    // ulaşılabilirlik güvencesi: en kötü yatay mesafede bile atış yetmeli
    const vmax = PULL_MIN + PULL_MAX;
    while(gap > 60 && !reachable(PR-PL-60, gap, vmax)) gap -= 12;
    nextY -= gap;
  }
  // ESKİ HATA: platformlar hiç silinmiyordu — artık ekran altındakiler budanıyor
  const cut = cam + visH + 340;
  if(plats.length > 80){
    for(let i=plats.length-1;i>=0;i--){
      const p=plats[i];
      if(p.y > cut && p !== ball.on) plats.splice(i,1);
    }
  }
}

/* ================= koşu ================= */
function reset(){
  plats.length=0; parts.length=0; rings.length=0; floats.length=0; recent.length=0;
  score=0; tick=0; shake=0; combo=0; comboBest=0; aim=null; aimId=null; buffered=false;
  slow=0; deadCause=''; zi=0; ziPrev=0; zMix=1; applyZone();
  srand((Date.now()^(Math.random()*0xffffffff))>>>0);

  const floor={kind:'plat', type:'ground', x:PL, y:0, w:PR-PL, h:600, px:PL};
  plats.push(floor);
  ball={x:VW/2, y:-BR, px:VW/2, py:-BR, rx:VW/2, ry:-BR, vx:0, vy:0,
        grounded:true, on:floor, trail:[],
        shield:false, rocket:false, airShots:0, inv:0};
  syncPower();
  landY=ball.y; lastPlat=floor;
  cam = 140 - visH; camBest = cam;
  nextY = -170;
  grow();
}

/* ================= fizik ================= */
function wallHit(){
  if(ball.x-BR < PL){
    ball.x = PL+BR;
    if(ball.vx < -3){ dust(PL+BR, ball.y, 4, ink, 1.6); Snd.wall(); }
    ball.vx = Math.abs(ball.vx)*.72;
  }else if(ball.x+BR > PR){
    ball.x = PR-BR;
    if(ball.vx > 3){ dust(PR-BR, ball.y, 4, ink, 1.6); Snd.wall(); }
    ball.vx = -Math.abs(ball.vx)*.72;
  }
}

function breakPlat(p){
  p.gone = true;
  Snd.crack(); addShake(2.4);
  for(let i=0;i<Math.round(10*quality);i++)
    parts.push({x:p.x+rand()*p.w, y:p.y+6, vx:rnd(-2.6,2.6), vy:rnd(-1.5,2.2),
                life:1, dec:rnd(.012,.026), s:rnd(2.5,5), c:VIOLET});
  if(ball.on===p){ ball.grounded=false; ball.on=null; }
}

function bumpCombo(p){
  if(p !== lastPlat && p.y < landY - 30){
    combo++;
    comboBest = Math.max(comboBest, combo);
    if(combo>=3){
      Snd.combo(combo);
      floater(ball.x, ball.y-26, '×'+combo, '#0E9E76');
    }
  }else if(p.y > landY + 70){
    combo = 0;
  }
  landY = p.y; lastPlat = p;
  elCombo.textContent = combo>=3 ? ('seri ×'+combo) : '';
  elCombo.classList.toggle('on', combo>=3);
}

function land(p){
  ball.y = p.y - BR;
  p.press = Math.min(1, Math.abs(ball.vy)/16 + .25);
  if(p.type==='bouncy'){
    const b = Math.abs(ball.vy)*.94 + 2.4;
    if(b > 5.2){
      ball.vy = -b; ball.vx *= .98;
      ring(ball.x, p.y, MINT); dust(ball.x, p.y, 7, MINT, 2.6);
      p.press = 1; addShake(b*.28); Snd.bounce(clamp(b/26,0,1));
      if(b > 17) flash(MINT, .14);
      bumpCombo(p);
      return;
    }
  }
  ball.vy = 0; ball.grounded = true; ball.on = p;
  bumpCombo(p);
  if(p.type==='crumble'){ ball.vx*=.6; dust(ball.x,p.y,5,VIOLET,2); Snd.land();
    if(p.fuse==null) p.fuse=28; }
  else { ball.vx*=.5; dust(ball.x,p.y,5,GREY,2); Snd.land(); }
  addShake(1.4);
  teach(p.type);
  startBufferedAim();
}

function hitPlat(p){
  const cx=clamp(ball.x, p.x, p.x+p.w), cy=clamp(ball.y, p.y, p.y+p.h);
  const dx=ball.x-cx, dy=ball.y-cy;
  if(dx*dx+dy*dy > BR*BR) return;
  if(ball.vy>0 && ball.py+BR <= p.y+Math.max(6, ball.vy)){ land(p); return; }
  if(ball.vy<0 && ball.py-BR >= p.y+p.h-3){ ball.y=p.y+p.h+BR; ball.vy=Math.abs(ball.vy)*.3; return; }
  ball.x = ball.x < p.x+p.w/2 ? p.x-BR : p.x+p.w+BR;
  ball.vx = -ball.vx*.45;
}

/* ESKİ HATA: yerdeyken çarpışma hiç test edilmiyordu; hareketli platform topun içinden geçiyordu */
function sidePush(){
  for(const p of plats){
    if(p.kind!=='plat' || p===ball.on || p.gone) continue;
    if(Math.abs(p.y-ball.y) > 90) continue;
    const cx=clamp(ball.x,p.x,p.x+p.w), cy=clamp(ball.y,p.y,p.y+p.h);
    const dx=ball.x-cx, dy=ball.y-cy;
    if(dx*dx+dy*dy > BR*BR) continue;
    if(ball.x < p.x+p.w/2){ ball.x = p.x-BR; ball.vx = Math.min(ball.vx, -1.2); }
    else { ball.x = p.x+p.w+BR; ball.vx = Math.max(ball.vx, 1.2); }
  }
}

function overlapSpike(s){
  const cx=clamp(ball.x,s.x,s.x+s.w), cy=clamp(ball.y,s.y,s.y+s.h);
  const dx=ball.x-cx, dy=ball.y-cy;
  return dx*dx+dy*dy < BR*BR*.86;
}
function nearSpike(s){
  const cx=clamp(ball.x,s.x,s.x+s.w), cy=clamp(ball.y,s.y,s.y+s.h);
  const dx=ball.x-cx, dy=ball.y-cy;
  return dx*dx+dy*dy < BR*BR*5.3;
}

/* ================= adım ================= */
let nextMile=250, newRecord=false;

function step(){
  tick++;
  shake *= reduceMotion ? .55 : .86;
  if(slow>0) slow--;

  for(const p of plats){
    if(p.kind!=='plat') continue;
    p.px = p.x;
    if(p.move==='h') p.x = p.bx + Math.sin(tick*p.spd + p.ph)*p.amp;
    else if(p.move==='v') p.y = p.by + Math.sin(tick*p.spd + p.ph)*p.amp;
    if(p.fuse > 0){ p.fuse--; if(p.fuse===0) breakPlat(p); }
    if(p.press > .01) p.press *= .8; else p.press = 0;
  }
  if(flashA > 0){ flashA *= .84; if(flashA < .01) flashA = 0; }
  if(sweep > 0){ sweep -= .022; if(sweep < 0) sweep = 0; }

  if(state==='play'){
    ball.rx = ball.x; ball.ry = ball.y;

    if(ball.grounded && ball.on && !ball.on.gone){
      const p = ball.on;
      ball.px = ball.x; ball.py = ball.y;
      ball.x += p.x - p.px;
      ball.y = p.y - BR;
      ball.vy = 0;
      ball.vx *= FRIC[p.type] ?? .88;
      if(Math.abs(ball.vx) < .06) ball.vx = 0;
      ball.x += ball.vx;
      wallHit();
      sidePush();
      if(ball.x < p.x-3 || ball.x > p.x+p.w+3){ ball.grounded=false; ball.on=null; }
    }else{
      if(ball.grounded){ ball.grounded=false; ball.on=null; }
      ball.vy += G;
      ball.vx += windNow();
      ball.vx = clamp(ball.vx, -MAXV, MAXV);
      ball.vy = clamp(ball.vy, -MAXV, MAXV);
      const sp = Math.hypot(ball.vx, ball.vy), n = Math.max(1, Math.ceil(sp/5));
      for(let i=0;i<n && !ball.grounded;i++){
        ball.px = ball.x; ball.py = ball.y;
        ball.x += ball.vx/n; ball.y += ball.vy/n;
        wallHit();
        for(const p of plats){
          if(p.kind!=='plat' || p.gone) continue;
          if(p.y > ball.y+260 || p.y+p.h < ball.y-260) continue;
          hitPlat(p);
          if(ball.grounded) break;
        }
      }
    }

    if(ball.inv > 0) ball.inv--;

    // güçlendirme toplama
    for(const o of plats){
      if(o.kind!=='orb' || o.taken) continue;
      if(Math.abs(o.y - ball.y) > 90) continue;
      const dx=ball.x-o.x, dy=ball.y-o.y, rr2=(BR+15)*(BR+15);
      if(dx*dx+dy*dy < rr2) grab(o);
    }

    // dikenler + kıl payı
    for(const s of plats){
      if(s.kind!=='spike') continue;
      if(ball.inv > 0) continue;
      if(s.y > ball.y+220 || s.y+s.h < ball.y-220) continue;
      if(overlapSpike(s)){ die('spike'); break; }
      if(!s.nm && !ball.grounded && nearSpike(s)){
        s.nm = true;
        floater(ball.x, ball.y-24, 'KIL PAYI', CORAL);
        Snd.near(); if(!reduceMotion) slow = 9;
      }
    }
  }

  if(state==='play'){
    ball.trail.push({x:ball.x, y:ball.y});
    if(ball.trail.length > 12) ball.trail.shift();

    const h = Math.round(-ball.y/12);
    if(h > score){
      score = h;
      if(score >= nextMile){
        nextMile = Math.ceil((score+1)/250)*250;
        toast(score - (score%250) + ' yükseklik');
        Snd.tick();
        elScore.classList.add('bump');
        setTimeout(()=>elScore.classList.remove('bump'), 110);
      }
      const z = zoneAt(score);
      if(z !== zi){
        ziPrev = zi; zi = z; zMix = 0;
        toast(ZONES[z].n, true, 2400); Snd.zone(); addShake(3);
        sweep = 1; flash(MINT, .2);
      }
    }
    if(zMix < 1){ zMix = Math.min(1, zMix + .014); if(tick%2===0 || zMix===1) applyZone(); }
  }

  // kamera — yalnızca sınırlı bir mesafe geri iner (düşmenin bedeli var)
  const target = ball.y - visH*.62;
  cam += (target - cam)*.11;
  camBest = Math.min(camBest, cam);
  cam = Math.min(cam, camBest + visH*FALLBACK, 140 - visH);
  grow();

  if(state==='play' && ball.y - BR > cam + visH + 20) die('fall');

  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i]; q.vy+=(q.g==null?.28:q.g); q.x+=q.vx; q.y+=q.vy; q.vx*=.98; q.life-=q.dec;
    if(q.life<=0 || q.y > cam+visH+160) parts.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const q=rings[i]; q.r+=3.4; q.life-=.055; if(q.life<=0) rings.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){
    const q=floats[i]; q.y-=.9; q.life-=.018; if(q.life<=0) floats.splice(i,1);
  }
}

/* ================= ölüm ================= */
function die(cause){
  if(state!=='play') return;
  if(ball.shield){ useShield(cause); return; }
  state = 'dying';
  deadCause = cause; deadAt = performance.now();
  addShake(12);
  aim=null; aimId=null; buffered=false;
  elCombo.classList.remove('on');

  const n = Math.round(26*quality);
  for(let i=0;i<n;i++) parts.push({x:ball.x, y:ball.y, vx:rnd(-6,6), vy:rnd(-7,3),
    life:1, dec:rnd(.012,.03), s:rnd(2.5,6), c:i%3?CORAL:ink});
  ring(ball.x, ball.y, CORAL);

  if(cause==='spike'){ Snd.pop(); flash(CORAL,.42); if(!reduceMotion) slow=16; }
  else { Snd.fall(); flash(CORAL,.26); }
  buzz(40);

  newRecord = score > save.best;
  save.runs++;
  save.best = Math.max(save.best, score);
  save.bestCombo = Math.max(save.bestCombo, comboBest);
  persist();
  if(newRecord){
    setTimeout(()=>Snd.record(), 260);
    for(let i=0;i<3;i++) setTimeout(()=>{ if(ball) burst(ball.x, ball.y, MINT, 16); }, 300+i*140);
  }

  clearTimeout(overTimer);
  overTimer = setTimeout(showOver, 780);
}

function showOver(){
  clearTimeout(overTimer);
  if(state !== 'dying') return;
  el('sc').textContent = score;
  el('bs').textContent = save.best;
  el('bc').textContent = save.bestCombo;
  el('overTitle').textContent = deadCause==='fall' ? 'Aşağı düştün' : 'Top patladı';
  el('overSub').textContent = deadCause==='fall'
    ? 'Kamera seni bekler ama sonsuza kadar değil.'
    : (comboBest>=3 ? 'Bu koşudaki en iyi seri: ×'+comboBest : 'Dikenlere dikkat.');
  el('recBadge').classList.toggle('hide', !newRecord);
  setState('dead');
}

/* ================= durum ================= */
function setState(s){
  state = s;
  elMenu.classList.toggle('hide', s!=='menu');
  elPause.classList.toggle('hide', s!=='paused');
  elOver.classList.toggle('hide', s!=='dead');
  elHud.classList.toggle('hide', s==='menu');
  if(s!=='count'){ clearTimeout(countTimer); elCount.classList.add('hide'); }
}

function pauseGame(){
  if(state!=='play' && state!=='count') return;
  aim=null; aimId=null; buffered=false;
  setState('paused');
}
function resumeGame(){
  if(state!=='paused') return;
  setState('count');
  elCount.classList.remove('hide');
  let n=3;
  (function next(){
    if(state!=='count') return;
    if(n===0){ elCount.classList.add('hide'); acc=0; last=performance.now(); setState('play'); return; }
    elCount.innerHTML = '<span>'+n+'</span>';
    Snd.tick(); n--;
    countTimer = setTimeout(next, 560);
  })();
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) pauseGame(); });

/* yeniden boyutlanma oyuncuyu asla öldürmesin */
addEventListener('resize', ()=>{
  if(!ball) return;

/* ================= giriş ================= */
const ptr = {x:0, y:0};
const MAXPULL = () => Math.min(W,H)*.26;

function launchVec(){
  if(!aim) return {x:0,y:0,t:0};
  const dx = aim.sx-aim.x, dy = aim.sy-aim.y;
  const len = Math.hypot(dx,dy), mp = MAXPULL();
  if(len < 1) return {x:0,y:0,t:0};
  const t = Math.min(1, len/mp);
  let power = (PULL_MIN + t*PULL_MAX) * (1 + Math.min(combo,10)*.018);
  if(ball.rocket) power *= 1.7;
  return {x:dx/len*power, y:dy/len*power, t};
}

function startAim(x,y){ aim = {sx:x, sy:y, x:x, y:y, lt:0}; }
function startBufferedAim(){
  if(buffered && aimId!==null && !aim){ startAim(ptr.x, ptr.y); buffered=false; }
}

cvs.addEventListener('pointerdown', e=>{
  Snd.resume();
  ptr.x=e.clientX; ptr.y=e.clientY;
  if(state==='dying'){
    if(performance.now()-deadAt > 320) showOver();
    return;
  }
  if(state!=='play') return;
  if(aimId!==null) return;                    // ikinci parmak nişanı bozmaz
  aimId = e.pointerId;
  try{ cvs.setPointerCapture(e.pointerId); }catch(err){}
  if(ball.grounded || ball.airShots > 0) startAim(e.clientX, e.clientY);
  else buffered = true;                        // havadayken bas, inince nişan başlasın
});

cvs.addEventListener('pointermove', e=>{
  if(e.pointerId !== aimId) return;
  ptr.x=e.clientX; ptr.y=e.clientY;
  if(!aim) return;
  aim.x=e.clientX; aim.y=e.clientY;
  const t = launchVec().t;
  if(Math.abs(t - aim.lt) > .1){ aim.lt=t; Snd.stretch(t); }
});

function release(e){
  if(e && aimId!==null && e.pointerId!==aimId) return;
  aimId = null; buffered = false;
  if(!aim){ return; }
  const v = launchVec();
  const air = !ball.grounded && ball.airShots > 0;
  if(v.t > .08 && ball && (ball.grounded || air)){
    const p = ball.on;
    if(p && p.type==='crumble' && p.fuse==null) p.fuse = 28;
    ball.grounded = false; ball.on = null;
    ball.vx = v.x; ball.vy = v.y;
    if(!air) ball.y -= 2;
    const rocket = ball.rocket;
    if(air){
      ball.airShots--;
      burst(ball.x, ball.y, VIOLET, 14); ring(ball.x, ball.y, VIOLET);
      Snd.airshot(); addShake(3);
    }
    if(rocket){
      ball.rocket = false;
      burst(ball.x, ball.y, AMBER, 22); ring(ball.x, ball.y, AMBER);
      flash(AMBER, .3); Snd.rocket(); addShake(6); buzz(22);
    }
    dust(ball.x, ball.y+BR, 6, GREY, 2.4);
    Snd.launch(v.t); buzz(8); addShake(v.t*1.8);
    syncPower();
    if(!save.taught){ save.taught = true; persist(); }
  }
  aim = null;
}
cvs.addEventListener('pointerup', release);
cvs.addEventListener('pointercancel', release);

/* ================= çizim ================= */
const pxAt = (p,tf)=> p.move==='h' ? p.bx + Math.sin(tf*p.spd+p.ph)*p.amp : p.x;
const pyAt = (p,tf)=> p.move==='v' ? p.by + Math.sin(tf*p.spd+p.ph)*p.amp : p.y;

/* bölgeye göre değişen, kamerayla farklı hızda kayan arka plan katmanları */
const BAND = 1400;
function drawParallax(){
  if(quality < .5) return;
  const motif = ZONES[zi].motif;
  ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineCap='round';
  for(const L of [{d:.22, n:6, s:1.5, a:.05}, {d:.46, n:8, s:1.0, a:.075}]){
    const off = cam * L.d;
    ctx.globalAlpha = L.a;
    for(let i=0;i<L.n;i++){
      const h1 = (i*2654435761) >>> 0;
      const x = PL + 18 + (h1 % 1000)/1000 * (PR-PL-36);
      const base = (h1 >>> 10) % BAND;
      let y = ((base - off) % BAND + BAND) % BAND - 250;
      const sc = L.s * (0.7 + ((h1>>>20)%100)/220);
      drawMotif(motif, x, y, 30*sc, ((h1>>>7)%628)/100);
    }
  }
  ctx.globalAlpha = 1; ctx.lineCap='butt';
}
function drawMotif(m, x, y, r, rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.beginPath();
  if(m==='dot'){ ctx.arc(0,0,r*.7,0,6.3); ctx.fill(); }
  else if(m==='shard'){
    ctx.moveTo(0,-r); ctx.lineTo(r*.5,r*.35); ctx.lineTo(-r*.42,r*.7); ctx.closePath(); ctx.fill();
  }
  else if(m==='drip'){
    ctx.moveTo(0,-r); ctx.quadraticCurveTo(r*.62,0, 0,r); ctx.quadraticCurveTo(-r*.62,0, 0,-r); ctx.fill();
  }
  else if(m==='arc'){
    ctx.lineWidth=r*.2; ctx.arc(0,0,r,-.5,2.1); ctx.stroke();
  }
  else if(m==='crack'){
    ctx.lineWidth=r*.14;
    ctx.moveTo(-r,-r*.6);
    for(let k=1;k<=5;k++) ctx.lineTo(-r + k*r*.4, -r*.6 + (k%2?r*.5:0) + k*r*.16);
    ctx.stroke();
  }
  else { // bolt
    ctx.moveTo(r*.2,-r); ctx.lineTo(-r*.35,r*.1); ctx.lineTo(r*.05,r*.1);
    ctx.lineTo(-r*.25,r); ctx.lineTo(r*.42,-r*.15); ctx.lineTo(0,-r*.15); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawOrb(o, tf){
  if(o.taken) return;
  const c = PW[o.type].c;
  const bob = Math.sin(tf*.045 + o.ph)*5;
  const y = o.y - cam + bob;
  const pulse = .5 + .5*Math.sin(tf*.07 + o.ph);

  ctx.globalAlpha = .16 + pulse*.16; ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(o.x, y, 24 + pulse*5, 0, 6.3); ctx.fill();
  ctx.globalAlpha = .5 + pulse*.35; ctx.strokeStyle = c; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(o.x, y, 17, 0, 6.3); ctx.stroke();
  ctx.globalAlpha = 1; ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(o.x, y, 11, 0, 6.3); ctx.fill();

  ctx.strokeStyle = paper; ctx.fillStyle = paper; ctx.lineWidth = 2;
  ctx.beginPath();
  if(o.type==='shield'){ ctx.arc(o.x, y+1.5, 5, Math.PI*1.15, Math.PI*1.85); ctx.stroke(); }
  else if(o.type==='rocket'){
    ctx.moveTo(o.x, y-5.5); ctx.lineTo(o.x+4.5, y+4.5); ctx.lineTo(o.x-4.5, y+4.5);
    ctx.closePath(); ctx.fill();
  }else{
    ctx.arc(o.x-3.4, y, 2.3, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(o.x+3.4, y, 2.3, 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* konik şerit iz — noktalar yerine gerçek bir kuyruk */
function drawTrail(bx, by){
  const T = ball.trail, n = T.length;
  if(n < 4) return;
  const wide = combo >= 3 ? 1.15 : .85;
  const up = [], dn = [];
  for(let i=0;i<n;i++){
    const p = T[i];
    const a = T[Math.max(0,i-1)], b = T[Math.min(n-1,i+1)];
    let dx = b.x-a.x, dy = b.y-a.y;
    const L = Math.hypot(dx,dy) || 1;
    const nx = -dy/L, ny = dx/L;
    const w = BR * (i/n) * wide;
    up.push([p.x+nx*w, p.y-cam+ny*w]);
    dn.push([p.x-nx*w, p.y-cam-ny*w]);
  }
  ctx.beginPath();
  ctx.moveTo(up[0][0], up[0][1]);
  for(let i=1;i<n;i++) ctx.lineTo(up[i][0], up[i][1]);
  ctx.lineTo(bx, by-cam);
  for(let i=n-1;i>=0;i--) ctx.lineTo(dn[i][0], dn[i][1]);
  ctx.closePath();
  ctx.globalAlpha = combo >= 3 ? .3 : .17;
  ctx.fillStyle = combo >= 3 ? MINT : ink;
  ctx.fill();
  ctx.globalAlpha = 1;
}

function rr(x,y,w,h,r){
  r=Math.min(r,h/2,w/2);
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawSpike(s){
  const y = s.y-cam;
  ctx.fillStyle = CORAL;
  if(s.dir==='up'){
    const n=Math.max(3, Math.round(s.w/11)), st=s.w/n;
    ctx.beginPath();
    for(let i=0;i<n;i++){
      ctx.moveTo(s.x+i*st, y+s.h);
      ctx.lineTo(s.x+i*st+st/2, y-3);
      ctx.lineTo(s.x+(i+1)*st, y+s.h);
    }
    ctx.fill();
    ctx.globalAlpha=.35; rr(s.x, y+s.h-4, s.w, 5, 2.5); ctx.fill(); ctx.globalAlpha=1;
  }else{
    const n=Math.max(3, Math.round(s.h/12)), st=s.h/n, right=s.dir==='right';
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const yy=y+i*st;
      if(right){ ctx.moveTo(s.x,yy); ctx.lineTo(s.x+s.w+3,yy+st/2); ctx.lineTo(s.x,yy+st); }
      else { ctx.moveTo(s.x+s.w,yy); ctx.lineTo(s.x-3,yy+st/2); ctx.lineTo(s.x+s.w,yy+st); }
    }
    ctx.fill();
  }
}

function drawPlat(p, tf){
  const pr = p.press || 0;
  const x = pxAt(p,tf) - p.w*pr*.045, y = pyAt(p,tf) - cam + pr*4.5;
  const c = p.type==='ground' || p.type==='normal' ? ink : COLOR[p.type];
  ctx.fillStyle = c;

  if(p.type==='ground'){ ctx.fillRect(x, y, p.w, Math.min(p.h, visH-y+60)); }
  else if(p.type==='crumble'){
    const f = p.fuse==null ? 1 : p.fuse/28;
    ctx.globalAlpha = .45 + f*.55;
    rr(x, y, p.w, p.h, 7); ctx.fill();
    ctx.globalAlpha = 1;
    if(p.fuse!=null){                       // çatlaklar
      ctx.strokeStyle = paper; ctx.lineWidth = 1.6; ctx.globalAlpha = .7*(1-f)+.2;
      ctx.beginPath();
      for(let i=1;i<4;i++){
        const cx = x + p.w*i/4;
        ctx.moveTo(cx-3, y+1); ctx.lineTo(cx+2, y+p.h*.55); ctx.lineTo(cx-2, y+p.h-1);
      }
      ctx.stroke(); ctx.globalAlpha=1;
    }
  }
  else { rr(x, y, p.w*(1+pr*.09), p.h*(1-pr*.3), 7); ctx.fill(); }

  if(p.type==='bouncy'){
    ctx.strokeStyle=c; ctx.lineWidth=2.5; ctx.globalAlpha=.5;
    ctx.beginPath(); ctx.moveTo(x+4,y-6); ctx.quadraticCurveTo(x+p.w/2,y-13,x+p.w-4,y-6);
    ctx.stroke(); ctx.globalAlpha=1;
  }else if(p.type==='normal'){
    ctx.fillStyle=paper; ctx.globalAlpha=.22;
    rr(x+5,y+3,p.w-10,3,2); ctx.fill(); ctx.globalAlpha=1;
  }
  if(p.move){
    ctx.fillStyle=c; ctx.globalAlpha=.22;
    ctx.beginPath(); ctx.arc(x+p.w/2, y+p.h+9, 2.6, 0, 6.3); ctx.fill(); ctx.globalAlpha=1;
  }
}

function drawBall(bx, by){
  const sp = Math.hypot(ball.vx, ball.vy);
  const glow = Math.min(combo,10)/10;
  drawTrail(bx, by);

  // hız çizgileri
  if(sp > 17 && quality > .5 && !reduceMotion){
    const a = Math.atan2(ball.vy, ball.vx), k = Math.min(1,(sp-17)/13);
    ctx.strokeStyle = ink; ctx.globalAlpha = .16*k; ctx.lineWidth = 1.6; ctx.lineCap='round';
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const off = (i-2)*9, ox = -Math.sin(a)*off, oy = Math.cos(a)*off;
      const L = 26 + (2-Math.abs(i-2))*16;
      ctx.moveTo(bx+ox - Math.cos(a)*BR*1.4, by-cam+oy - Math.sin(a)*BR*1.4);
      ctx.lineTo(bx+ox - Math.cos(a)*(BR*1.4+L), by-cam+oy - Math.sin(a)*(BR*1.4+L));
    }
    ctx.stroke(); ctx.globalAlpha=1; ctx.lineCap='butt';
  }

  if(combo>=3){
    ctx.strokeStyle=MINT; ctx.globalAlpha=.28+glow*.3; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(bx, by-cam, BR+5+glow*3, 0, 6.3); ctx.stroke(); ctx.globalAlpha=1;
  }
  if(ball.shield){
    const pl = .5+.5*Math.sin(tick*.09);
    ctx.strokeStyle=ICE; ctx.globalAlpha=.45+pl*.35; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(bx, by-cam, BR+9+pl*2, 0, 6.3); ctx.stroke();
    ctx.globalAlpha=.12+pl*.1; ctx.fillStyle=ICE;
    ctx.beginPath(); ctx.arc(bx, by-cam, BR+9+pl*2, 0, 6.3); ctx.fill();
    ctx.globalAlpha=1;
  }
  if(ball.airShots>0){
    ctx.strokeStyle=VIOLET; ctx.globalAlpha=.6; ctx.lineWidth=2.4; ctx.setLineDash([4,7]);
    ctx.beginPath(); ctx.arc(bx, by-cam, BR+15, tick*.03, tick*.03+6.283); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
  }
  if(ball.rocket){
    const pulse = .55+.45*Math.sin(tick*.2);
    if(sp > 3){
      const a = Math.atan2(ball.vy, ball.vx);
      for(let i=1;i<=3;i++){
        const d = BR + i*9, r = (4.6 - i*.9)*(0.8+pulse*.4);
        ctx.globalAlpha = (.55 - i*.13);
        ctx.fillStyle = i===1 ? '#FFE27A' : AMBER;
        ctx.beginPath();
        ctx.arc(bx - Math.cos(a)*d, by-cam - Math.sin(a)*d, r, 0, 6.3); ctx.fill();
      }
    }else{
      ctx.strokeStyle=AMBER; ctx.globalAlpha=.4+pulse*.4; ctx.lineWidth=2.6;
      ctx.beginPath(); ctx.arc(bx, by-cam, BR+7+pulse*2, 0, 6.3); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  if(ball.inv>0 && (tick>>2)%2===0){
    ctx.strokeStyle=ICE; ctx.globalAlpha=.5; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(bx, by-cam, BR+5, 0, 6.3); ctx.stroke(); ctx.globalAlpha=1;
  }
  const st = clamp(sp/34, 0, .32), ang = Math.atan2(ball.vy, ball.vx);
  ctx.save();
  ctx.translate(bx, by-cam);
  if(!ball.grounded) ctx.rotate(ang);
  ctx.scale(1+st, 1-st);
  ctx.fillStyle=ink; ctx.beginPath(); ctx.arc(0,0,BR,0,6.3); ctx.fill();
  ctx.restore();
  ctx.fillStyle=paper; ctx.globalAlpha=.85;
  ctx.beginPath(); ctx.arc(bx-BR*.3, by-cam-BR*.34, BR*.22, 0, 6.3); ctx.fill();
  ctx.globalAlpha=1;
}

function drawAim(bx, by){
  const v = launchVec();
  if(v.t < .05) return;
  const sy = by-cam;
  ctx.strokeStyle=ink; ctx.globalAlpha=.3; ctx.lineWidth=2.4; ctx.setLineDash([5,6]);
  ctx.beginPath(); ctx.moveTo(bx,sy); ctx.lineTo(bx-v.x*7, sy-v.y*7); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha=1;

  // yörünge — ilk çarpışmada kesilir, yanlış bilgi vermez
  let x=bx, y=by, vx=v.x, vy=v.y, w=windNow();
  for(let i=1;i<=52;i++){
    vy+=G; vx+=w; x+=vx; y+=vy;
    if(x-BR<PL){ x=PL+BR; vx=Math.abs(vx)*.72; }
    if(x+BR>PR){ x=PR-BR; vx=-Math.abs(vx)*.72; }
    let hit=false;
    for(const p of plats){
      if(p.gone || p.type==='ground') continue;
      if(Math.abs(p.y-y)>120) continue;
      const cx=clamp(x,p.x,p.x+p.w), cy=clamp(p.kind==='spike'?y:y, p.y, p.y+p.h);
      const dx=x-cx, dy=y-cy;
      if(dx*dx+dy*dy < BR*BR){ hit=true; break; }
    }
    if(hit){
      ctx.globalAlpha=.5; ctx.strokeStyle=ink; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x, y-cam, 7, 0, 6.3); ctx.stroke();
      ctx.globalAlpha=1;
      break;
    }
    if(i%3===0){
      const k=1-i/60;
      ctx.globalAlpha=.44*k; ctx.fillStyle=ink;
      ctx.beginPath(); ctx.arc(x, y-cam, Math.max(1.5,3.2*k), 0, 6.3); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle = v.t>.92 ? CORAL : MINT; ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.arc(bx, sy, BR+8, -1.5708, -1.5708+6.283*v.t); ctx.stroke();
}

function drawHand(bx, by){
  const t = (tick%128)/128;
  const e = t<.74 ? (1-Math.pow(1-t/.74,3)) : 0;
  const d = 86*e;
  const sy = by-cam;
  const hx = bx + d*.93, hy = sy + d*.37;
  const fade = t<.74 ? 1 : 1-(t-.74)/.26;

  // çift katmanlı çizgi: hem açık hem koyu zeminde görünür
  ctx.setLineDash([5,6]);
  ctx.strokeStyle='rgba('+paperC.join(',')+',.75)'; ctx.lineWidth=6; ctx.globalAlpha=fade*.8;
  ctx.beginPath(); ctx.moveTo(bx,sy); ctx.lineTo(hx,hy); ctx.stroke();
  ctx.strokeStyle=ink; ctx.lineWidth=2.2; ctx.globalAlpha=fade*.5;
  ctx.beginPath(); ctx.moveTo(bx,sy); ctx.lineTo(hx,hy); ctx.stroke();
  ctx.setLineDash([]);

  ctx.globalAlpha=fade;
  ctx.fillStyle='rgb('+paperC.join(',')+')';
  ctx.beginPath(); ctx.arc(hx,hy,14,0,6.3); ctx.fill();
  ctx.strokeStyle=ink; ctx.lineWidth=2.4; ctx.globalAlpha=fade*.75;
  ctx.beginPath(); ctx.arc(hx,hy,14,0,6.3); ctx.stroke();
  ctx.globalAlpha=1;

  ctx.fillStyle=ink; ctx.globalAlpha=.6;
  ctx.font='500 16px Outfit, system-ui, sans-serif'; ctx.textAlign='center';
  ctx.fillText('geri çek ve bırak', VW/2, sy-54);
  ctx.globalAlpha=1;
}
function draw(alpha){
  const tf = tick + alpha;
  const sh = shake>.4 ? shake : 0;
  const sx = sh ? (Math.random()*2-1)*sh : 0, sy = sh ? (Math.random()*2-1)*sh : 0;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = ink; ctx.fillRect(0,0,W,H);              // letterbox zemini
  ctx.setTransform(DPR*S,0,0,DPR*S,(offX+sx)*DPR, sy*DPR);

  ctx.fillStyle = paper; ctx.fillRect(0, -4, VW, visH+8);
  drawParallax();

  // yükseklik çizgileri
  ctx.strokeStyle=ink; ctx.fillStyle=ink;
  const first = Math.floor(cam/600)*600;
  ctx.lineWidth=1;
  for(let y=first; y<cam+visH+600; y+=600){
    ctx.globalAlpha=.07;
    ctx.beginPath(); ctx.moveTo(PL, y-cam+.5); ctx.lineTo(PR, y-cam+.5); ctx.stroke();
    if(y<0){
      ctx.globalAlpha=.2; ctx.font='500 11px Outfit, system-ui, sans-serif'; ctx.textAlign='left';
      ctx.fillText(Math.round(-y/12), PL+8, y-cam-6);
    }
  }
  ctx.globalAlpha=1;

  // rüzgâr
  const wnd = windNow();
  if(Math.abs(wnd) > .004){
    ctx.strokeStyle=ink; ctx.lineWidth=1.4; ctx.globalAlpha=.13;
    const dir = Math.sign(wnd), sp=(tick*3*dir)%180;
    ctx.beginPath();
    for(let i=0;i<16;i++){
      const yy = (i*67 + tick*.7) % visH;
      const xx = PL + ((i*113 + sp + 900) % (PR-PL-40));
      ctx.moveTo(xx, yy); ctx.lineTo(xx + 30*dir, yy - 5);
    }
    ctx.stroke(); ctx.globalAlpha=1;
  }

  // duvarlar
  ctx.fillStyle=ink;
  ctx.fillRect(0, -4, PL, visH+8); ctx.fillRect(PR, -4, VW-PR, visH+8);
  ctx.fillStyle=paper; ctx.globalAlpha=.18;
  for(let y=Math.floor(cam/46)*46 - cam; y<visH+46; y+=46){
    ctx.fillRect(PL-4, y, 3, 20); ctx.fillRect(PR+1, y, 3, 20);
  }
  ctx.globalAlpha=1;

  for(const p of plats){
    const y = pyAt(p,tf) - cam;
    if(p.gone) continue;
    if(y > visH+80 || y+p.h < -80) continue;
    if(p.kind==='spike') drawSpike(p);
    else if(p.kind==='orb') drawOrb(p, tf);
    else drawPlat(p, tf);
  }
  ctx.setTransform(DPR*S,0,0,DPR*S,(offX+sx)*DPR, sy*DPR);

  for(const q of rings){
    ctx.globalAlpha=q.life*.5; ctx.strokeStyle=q.c; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(q.x, q.y-cam, q.r, 0, 6.3); ctx.stroke();
  }
  for(const q of parts){
    ctx.globalAlpha=Math.max(0,q.life); ctx.fillStyle=q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y-cam, q.s*q.life, 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha=1;

  // HUD perdesi — skor her zaman okunur kalsın
  {
    const sg = ctx.createLinearGradient(0, 0, 0, 118);
    sg.addColorStop(0, 'rgba('+paperC.join(',')+',.95)');
    sg.addColorStop(.62,'rgba('+paperC.join(',')+',.72)');
    sg.addColorStop(1,  'rgba('+paperC.join(',')+',0)');
    ctx.fillStyle=sg; ctx.fillRect(PL, 0, PR-PL, 118);
  }

  if(state==='play' || state==='dying'){
    const bx = lerp(ball.rx, ball.x, alpha), by = lerp(ball.ry, ball.y, alpha);
    if(state==='play'){
      drawBall(bx, by);
      if(aim) drawAim(bx, by);
      else if(!save.taught && ball.grounded && score<10) drawHand(bx, by);
    }
  }

  for(const q of floats){
    ctx.globalAlpha=Math.min(1,q.life*1.6); ctx.fillStyle=q.c; ctx.textAlign='center';
    ctx.font='600 15px Outfit, system-ui, sans-serif';
    ctx.fillText(q.text, q.x, q.y-cam);
  }
  ctx.globalAlpha=1;

  // bölge geçiş bandı
  if(sweep > 0){
    const yy = (1-sweep)*(visH+180) - 90;
    const g = ctx.createLinearGradient(0, yy-90, 0, yy+90);
    g.addColorStop(0,'rgba(46,216,168,0)');
    g.addColorStop(.5,'rgba(46,216,168,'+(sweep*.34).toFixed(3)+')');
    g.addColorStop(1,'rgba(46,216,168,0)');
    ctx.fillStyle=g; ctx.fillRect(PL, yy-90, PR-PL, 180);
  }

  // düşme uyarısı — alt kenar kırmızılaşır
  if(state==='play' && cam >= camBest + visH*FALLBACK - 1){
    const margin = (cam+visH) - ball.y;
    if(margin < visH*.42){
      const a = clamp(1 - margin/(visH*.42), 0, 1)*.45;
      const g = ctx.createLinearGradient(0, visH*.78, 0, visH);
      g.addColorStop(0,'rgba(255,77,94,0)'); g.addColorStop(1,'rgba(255,77,94,'+a.toFixed(3)+')');
      ctx.fillStyle=g; ctx.fillRect(0, visH*.78, VW, visH*.22);
    }
  }
  // vinyet — seri yükseldikçe ve düşme sınırına yaklaştıkça koyulaşır
  const vigT = Math.max(Math.min(combo,10)/10*.5,
                        state==='play' && cam >= camBest + visH*FALLBACK - 1
                          ? clamp(1-((cam+visH)-ball.y)/(visH*.42),0,1) : 0);
  vig += (vigT - vig)*.08;
  if(vig > .02 && !reduceMotion){
    const g = ctx.createRadialGradient(VW/2, visH*.5, visH*.22, VW/2, visH*.5, visH*.76);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,'+(vig*.42).toFixed(3)+')');
    ctx.fillStyle=g; ctx.fillRect(0, -4, VW, visH+8);
  }

  ctx.setTransform(DPR,0,0,DPR,0,0);

  // tam ekran flaş
  if(flashA > .01){
    const [r,g2,b2] = hex(flashC);
    ctx.fillStyle = 'rgba('+r+','+g2+','+b2+','+Math.min(.42,flashA).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
}

/* ================= döngü ================= */
let acc=0, last=performance.now(), frames=0, fpsT=performance.now(), shownScore=-1;

function loop(now){
  requestAnimationFrame(loop);
  let dt = now - last; last = now;
  if(dt > 250) dt = STEP;                       // sekmeden dönüşte sıçrama yok
  const active = state==='play' || state==='dying';
  acc += Math.min(dt, 100) * (slow>0 ? .34 : 1);
  let guard = 0;
  while(acc >= STEP && guard++ < 5){
    if(active) step();
    acc -= STEP;
  }
  if(guard >= 5) acc = 0;                       // ağır çekim spirali koruması

  frames++;
  if(now - fpsT > 1000){
    fpsAvg = frames*1000/(now-fpsT); frames=0; fpsT=now;
    quality = fpsAvg<42 ? .4 : fpsAvg<52 ? .7 : 1;
    if(reduceMotion) quality = Math.min(quality, .35);
  }

  if(shownScore !== score){ shownScore = score; elScore.textContent = score; }
  draw(active ? clamp(acc/STEP,0,1) : 0);
}

/* ================= başlangıç ================= */
reset();
setState('menu');
requestAnimationFrame(loop);
})();
</script>
