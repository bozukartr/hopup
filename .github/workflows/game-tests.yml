name: Game regression
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/physics.test.mjs
      - run: node tests/game.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-previews
          path: tests/*.png
